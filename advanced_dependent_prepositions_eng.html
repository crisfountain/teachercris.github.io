let currentMode = 'A';
let currentDataset = datasetA;
let currentIndex = 0;
let score = 0;
let streak = 0;
let isAnswerChecked = false;
let soundEnabled = true;

// Sound FX Synthesizer
let audioCtx = null;
function playSound(type) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'success') {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sine'; osc1.frequency.setValueAtTime(523.25, now); osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
      osc2.type = 'triangle'; osc2.frequency.setValueAtTime(659.25, now + 0.08); osc2.frequency.exponentialRampToValueAtTime(783.99, now + 0.22);
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.18, now + 0.05); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
      osc1.start(now); osc2.start(now + 0.08); osc1.stop(now + 0.35); osc2.stop(now + 0.35);
    } else if (type === 'error') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(260, now); osc.frequency.setValueAtTime(220, now + 0.12);
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.16, now + 0.03); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.28);
    }
  } catch(e) {}
}

// Proven British Female Voice Selector
function getBritishFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  const preferredFemaleVoices = [
    'Google UK English Female',
    'Microsoft Libby Online (Natural) - English (United Kingdom)',
    'Microsoft Sonia Online (Natural) - English (United Kingdom)',
    'Microsoft Maisie Online (Natural) - English (United Kingdom)',
    'Serena (Premium)', 'Serena (Enhanced)', 'Serena',
    'Kate (Premium)', 'Kate (Enhanced)', 'Kate',
    'Stephanie (Premium)', 'Stephanie (Enhanced)', 'Stephanie',
    'Fiona', 'Martha', 'Microsoft Susan', 'Microsoft Hazel'
  ];
  for (const name of preferredFemaleVoices) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return found;
  }
  const maleKeywords = ['male', 'george', 'daniel', 'ryan', 'arthur', 'oliver', 'david', 'mark'];
  const enGbFemale = voices.find(v => {
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    const name = (v.name || '').toLowerCase();
    const isUK = lang === 'en-gb' || name.includes('united kingdom') || name.includes('uk english') || name.includes('british');
    return isUK && !maleKeywords.some(m => name.includes(m));
  });
  if (enGbFemale) return enGbFemale;
  const anyGb = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase() === 'en-gb');
  if (anyGb) return anyGb;
  const anyFemaleEnglish = voices.find(v => {
    const name = (v.name || '').toLowerCase();
    const lang = (v.lang || '').toLowerCase();
    return lang.startsWith('en') && !maleKeywords.some(m => name.includes(m));
  });
  if (anyFemaleEnglish) return anyFemaleEnglish;
  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

function speakCurrentSentence() {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const current = currentDataset[currentIndex];
  const sentence = current.q.replace('___', 'blank');
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'en-GB';
  const voice = getBritishFemaleVoice();
  if (voice) {
    utterance.voice = voice;
  }
  utterance.rate = 0.98;
  utterance.pitch = 1.05;
  window.speechSynthesis.speak(utterance);
}

function switchQuizMode(mode) {
  currentMode = mode;
  currentDataset = (mode === 'A') ? datasetA : datasetB;
  currentIndex = 0;
  score = 0;
  streak = 0;

  const btnA = document.getElementById('tab-quiz-a');
  const btnB = document.getElementById('tab-quiz-b');
  const sub = document.getElementById('subtitulo-quiz');

  if (mode === 'A') {
    btnA.className = "py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition shadow-xs cursor-pointer bg-white text-indigo-600";
    btnB.className = "py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition shadow-xs cursor-pointer text-slate-600 hover:text-slate-900";
    sub.innerText = "Advanced Dependent Prepositions Practice (Quiz A)";
  } else {
    btnB.className = "py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition shadow-xs cursor-pointer bg-white text-indigo-600";
    btnA.className = "py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition shadow-xs cursor-pointer text-slate-600 hover:text-slate-900";
    sub.innerText = "Advanced Dependent Prepositions Practice (Quiz B)";
  }
  loadChallenge();
}

function loadChallenge() {
  if (currentIndex >= currentDataset.length) {
    showFinalSummary();
    return;
  }
  isAnswerChecked = false;
  const current = currentDataset[currentIndex];

  document.getElementById('progreso-texto').innerText = `Task ${currentIndex + 1} of ${currentDataset.length}`;
  document.getElementById('puntuacion').innerText = `Correct: ${score}`;
  document.getElementById('streak-badge').innerText = `Streak: ${streak}`;

  const pct = Math.round(((currentIndex + 1) / currentDataset.length) * 100);
  document.getElementById('barra-progreso').style.width = `${pct}%`;

  document.getElementById('btn-categoria').innerText = `${current.category} (CLICK FOR CATEGORY ℹ️)`;

  const parts = current.q.split('___');
  document.getElementById('pregunta-texto').innerHTML = `<span>${parts[0]}</span><span id="blank-slot" class="inline-block mx-1.5 px-3 py-0.5 rounded-lg border font-extrabold bg-white text-indigo-600 border-indigo-200/80 shadow-xs align-middle">___</span><span>${parts[1]}</span>`;

  document.getElementById('pista-contenido').innerText = current.h;
  document.getElementById('pista-texto').classList.add('hidden');

  const inputEl = document.getElementById('userInput');
  inputEl.value = '';
  inputEl.disabled = false;
  inputEl.className = "w-full px-5 py-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition text-base font-semibold text-slate-800 placeholder-slate-400 bg-white shadow-inner";
  inputEl.focus();

  const feedbackBox = document.getElementById('feedback-box');
  feedbackBox.className = 'hidden p-5 rounded-2xl mb-6 border transition-all duration-300';
  document.getElementById('btn-verificar').classList.remove('hidden');
}

function verifyAnswer() {
  if (isAnswerChecked) return;
  const inputEl = document.getElementById('userInput');
  const userVal = inputEl.value.trim().toLowerCase();
  if (!userVal) return;

  isAnswerChecked = true;
  const current = currentDataset[currentIndex];
  const allAnswers = [current.answer.toLowerCase(), ...(current.alt || []).map(a => a.toLowerCase())];
  const isCorrect = allAnswers.includes(userVal);

  if (isCorrect) {
    score++;
    streak++;
    playSound('success');
  } else {
    streak = 0;
    playSound('error');
  }

  const slot = document.getElementById('blank-slot');
  if (slot) {
    slot.innerText = current.answer;
    slot.className = 'inline-block mx-1.5 px-3 py-0.5 rounded-lg border font-extrabold bg-indigo-100 text-indigo-800 border-indigo-200 align-middle';
  }

  inputEl.disabled = true;
  if (isCorrect) {
    inputEl.className = "w-full px-5 py-4 rounded-2xl border-2 border-emerald-500 font-bold text-emerald-800 bg-emerald-50 transition text-base shadow-inner";
  } else {
    inputEl.className = "w-full px-5 py-4 rounded-2xl border-2 border-rose-400 font-bold text-rose-800 bg-rose-50 transition text-base shadow-inner";
  }

  const feedbackBox = document.getElementById('feedback-box');
  feedbackBox.className = 'p-5 rounded-2xl mb-6 border transition-all duration-300 ' + (isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200');
  
  document.getElementById('feedback-titulo').innerText = isCorrect ? 'Excellent!' : 'Key Distinction / Take Note!';
  document.getElementById('feedback-titulo').className = 'font-bold text-lg mb-2 ' + (isCorrect ? 'text-emerald-800' : 'text-rose-800');
  document.getElementById('feedback-explicacion').innerHTML = current.expl;
  document.getElementById('feedback-alert').innerText = current.alert;
  document.getElementById('feedback-chunk').innerText = `Chunk: ${current.chunk}`;

  feedbackBox.classList.remove('hidden');
  document.getElementById('btn-verificar').classList.add('hidden');
  document.getElementById('puntuacion').innerText = `Correct: ${score}`;
  document.getElementById('streak-badge').innerText = `Streak: ${streak}`;
}

document.getElementById('btn-verificar').onclick = verifyAnswer;
document.getElementById('btn-siguiente').onclick = () => { currentIndex++; loadChallenge(); };
document.getElementById('btn-anterior').onclick = () => { if (currentIndex > 0) { currentIndex--; loadChallenge(); } };
document.getElementById('btn-pista-inferior').onclick = () => { document.getElementById('pista-texto').classList.toggle('hidden'); };
document.getElementById('btn-mostrar-respuesta').onclick = () => {
  if (isAnswerChecked) return;
  const current = currentDataset[currentIndex];
  document.getElementById('userInput').value = current.answer;
  verifyAnswer();
};

document.getElementById('btn-restart').onclick = () => { currentIndex = 0; score = 0; streak = 0; loadChallenge(); };
document.getElementById('btn-audio-sentence').onclick = speakCurrentSentence;

document.getElementById('userInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!isAnswerChecked) verifyAnswer();
    else { currentIndex++; loadChallenge(); }
  }
});

    </div>
  `;
}
