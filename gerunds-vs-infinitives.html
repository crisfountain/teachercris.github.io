const SHUFFLE_OFFSETS = [
  1, 2, 0, 3, 2, 1, 3, 0, 2, 1, 0, 3,
  2, 0, 1, 3, 1, 2, 0, 3, 2, 0, 1, 3,
  0, 2, 1, 3, 2, 0, 1, 3, 1, 2, 0, 3,
  2, 0, 1, 3, 2, 1, 0, 3, 1
];

const processedDataset = rawDataset.map((item, idx) => {
  const correctVal = item.options[0];
  const others = item.options.slice(1);
  const targetIdx = SHUFFLE_OFFSETS[idx % SHUFFLE_OFFSETS.length] % 4;
  const newOpts = [];
  let ptr = 0;
  for (let i = 0; i < 4; i++) {
    if (i === targetIdx) newOpts.push(correctVal);
    else newOpts.push(others[ptr++]);
  }
  return { ...item, options: newOpts, correct: targetIdx };
});

// Web Audio synthesizer for tactile sound FX
function playSound(type) {
  if (!soundEnabled) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    if (type === 'success') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    } else if (type === 'error') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(190, now + 0.18);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    } else if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    }
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + (type === 'click' ? 0.08 : type === 'success' ? 0.35 : 0.28));
  } catch(e) {}
}
