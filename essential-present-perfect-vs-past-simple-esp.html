// Audio Synth
let audioCtx = null;
function playSound(type) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'correct') {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sine'; osc1.frequency.setValueAtTime(523.25, now); osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
      osc2.type = 'triangle'; osc2.frequency.setValueAtTime(659.25, now + 0.08); osc2.frequency.exponentialRampToValueAtTime(783.99, now + 0.22);
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.18, now + 0.05); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
      osc1.start(now); osc2.start(now + 0.08); osc1.stop(now + 0.35); osc2.stop(now + 0.35);
    } else if (type === 'incorrect') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(260, now); osc.frequency.setValueAtTime(220, now + 0.12);
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.16, now + 0.03); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.28);
    }
  } catch(e) {}
}

function getBritishFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;

  const preferredFemaleVoices = [
    'Google UK English Female',
    'Microsoft Libby Online (Natural) - English (United Kingdom)',
    'Microsoft Sonia Online (Natural) - English (United Kingdom)',
    'Microsoft Maisie Online (Natural) - English (United Kingdom)',
    'Serena (Premium)', 'Serena (Enhanced)', 'Serena',
    'Kate (Premium)', 'Kate (Enhanced)', 'Kate',
    'Stephanie (Premium)', 'Stephanie (Enhanced)', 'Stephanie',
    'Fiona', 'Martha', 'Microsoft Susan', 'Microsoft Hazel'
  ];

  for (const name of preferredFemaleVoices) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return found;
  }

  const maleKeywords = ['male', 'george', 'daniel', 'ryan', 'arthur', 'oliver', 'david', 'mark'];
  const enGbFemale = voices.find(v => {
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    const name = (v.name || '').toLowerCase();
    const isUK = lang === 'en-gb' || name.includes('united kingdom') || name.includes('uk english') || name.includes('british');
    return isUK && !maleKeywords.some(m => name.includes(m));
  });
  if (enGbFemale) return enGbFemale;

  const anyGb = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase() === 'en-gb');
  if (anyGb) return anyGb;

  const anyFemaleEnglish = voices.find(v => {
    const name = (v.name || '').toLowerCase();
    const lang = (v.lang || '').toLowerCase();
    return lang.startsWith('en') && !maleKeywords.some(m => name.includes(m));
  });
  if (anyFemaleEnglish) return anyFemaleEnglish;

  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

function speakCurrentSentence() {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const currentList = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  const sentence = currentList[localIndex].q.replace(/___+/g, ', ');
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'en-GB';

  const voice = getBritishFemaleVoice();
  if (voice) {
    utterance.voice = voice;
  }

  utterance.rate = 0.98;
  utterance.pitch = 1.05;
  window.speechSynthesis.speak(utterance);
}

function getCurrentChallenge() {
  const list = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  return list[localIndex];
}

function renderTask() {
  const currentList = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  const current = currentList[localIndex];
  
  selectedOption = null;
  isAnswerVerified = false;

  // Header & Counts
  document.getElementById('task-counter').innerText = `Task ${localIndex + 1} of ${currentList.length}`;
  document.getElementById('score-display').innerText = score;
  document.getElementById('streak-display').innerText = streak;
  document.getElementById('quiz-subtitle').innerText = `Present Perfect Master Practice (${currentQuizMode === 'A' ? 'Quiz A' : 'Quiz B'})`;

  // Aspect Category Pill
  const aspect = current.targetAspect || 'PRESENT PERFECT';
  document.getElementById('category-pill-text').innerText = aspect;

  // Question & Hint
  document.getElementById('pregunta-texto').innerText = current.q;
  document.getElementById('pista-texto').innerText = current.h;
  document.getElementById('pista-box').classList.add('hidden');

  // Feedback Box & Verify Button
  document.getElementById('feedback-box').classList.add('hidden');
  const btnVerify = document.getElementById('btn-verify');
  btnVerify.innerText = 'Verify (Enter)';
  btnVerify.disabled = true;

  // Render Options
  const container = document.getElementById('opciones-contenedor');
  container.innerHTML = '';
  current.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'w-full text-left p-4 rounded-xl border border-slate-200 font-semibold text-slate-700 bg-slate-50 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-700 transition flex justify-between items-center shadow-xs cursor-pointer';
    btn.innerHTML = `<span class="text-sm sm:text-base">${opt}</span><i class="far fa-circle text-slate-300"></i>`;
    btn.onclick = () => selectOption(idx);
    container.appendChild(btn);
  });

  // Prev / Next button state
  document.getElementById('btn-prev').disabled = (localIndex === 0);
  document.getElementById('btn-prev').classList.toggle('opacity-50', localIndex === 0);
}

function selectOption(idx) {
  if (isAnswerVerified) return;
  selectedOption = idx;
  const container = document.getElementById('opciones-contenedor');
  const buttons = container.children;

  Array.from(buttons).forEach((btn, i) => {
    if (i === idx) {
      btn.className = 'w-full text-left p-4 rounded-xl border-2 border-blue-600 font-bold text-blue-900 bg-blue-50/80 transition flex justify-between items-center shadow-xs cursor-pointer';
      btn.querySelector('i').className = 'fas fa-check-circle text-blue-600';
    } else {
      btn.className = 'w-full text-left p-4 rounded-xl border border-slate-200 font-semibold text-slate-700 bg-slate-50 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-700 transition flex justify-between items-center shadow-xs cursor-pointer';
      btn.querySelector('i').className = 'far fa-circle text-slate-300';
    }
  });

  document.getElementById('btn-verify').disabled = false;
}

function verifyAnswer() {
  if (selectedOption === null) return;
  if (isAnswerVerified) {
    nextTask();
    return;
  }

  isAnswerVerified = true;
  const current = getCurrentChallenge();
  const isCorrect = (selectedOption === current.correct);

  const container = document.getElementById('opciones-contenedor');
  const buttons = container.children;

  Array.from(buttons).forEach((btn, i) => {
    btn.disabled = true;
    if (i === current.correct) {
      btn.className = 'w-full text-left p-4 rounded-xl border-2 border-emerald-500 font-bold text-emerald-800 bg-emerald-50 transition flex justify-between items-center shadow-xs cursor-default';
      btn.querySelector('i').className = 'fas fa-check-circle text-emerald-600';
    } else if (i === selectedOption && !isCorrect) {
      btn.className = 'w-full text-left p-4 rounded-xl border-2 border-rose-400 font-bold text-rose-800 bg-rose-50 transition flex justify-between items-center shadow-xs cursor-default';
      btn.querySelector('i').className = 'fas fa-times-circle text-rose-500';
    } else {
      btn.className = 'w-full text-left p-4 rounded-xl border border-slate-100 font-normal text-slate-400 bg-slate-50 opacity-60 flex justify-between items-center cursor-default';
      btn.querySelector('i').className = 'far fa-circle text-slate-200';
    }
  });

  if (isCorrect) {
    playSound('correct');
    if (!solvedTasks[current.id]) {
      score++;
      solvedTasks[current.id] = true;
      document.getElementById('score-display').innerText = score;
    }
    streak++;
    document.getElementById('streak-display').innerText = streak;
  } else {
    playSound('incorrect');
    streak = 0;
    document.getElementById('streak-display').innerText = streak;
  }

  // Feedback Box
  const feedbackBox = document.getElementById('feedback-box');
  const feedbackTitulo = document.getElementById('feedback-titulo');
  const feedbackTarget = document.getElementById('feedback-target-badge');
  const feedbackExplicacion = document.getElementById('feedback-explicacion');
  const feedbackAlert = document.getElementById('feedback-alert');
  const feedbackChunk = document.getElementById('feedback-chunk');

  if (isCorrect) {
    feedbackBox.className = 'p-5 rounded-2xl mb-5 border bg-emerald-50/90 border-emerald-200 block transition-all';
    feedbackTitulo.innerText = 'Excellent!';
    feedbackTitulo.className = 'font-bold text-base sm:text-lg text-emerald-800';
    feedbackTarget.classList.add('hidden');
  } else {
    feedbackBox.className = 'p-5 rounded-2xl mb-5 border bg-rose-50/90 border-rose-200 block transition-all';
    feedbackTitulo.innerText = 'Key Distinction / Take Note!';
    feedbackTitulo.className = 'font-bold text-base sm:text-lg text-rose-800';
    feedbackTarget.innerText = `Target: ${current.options[current.correct]}`;
    feedbackTarget.classList.remove('hidden');
  }

  feedbackExplicacion.innerText = current.expl;
  feedbackAlert.innerText = current.alert;
  feedbackChunk.innerText = `Chunk: ${current.chunk}`;

  // Update button to Next
  const btnVerify = document.getElementById('btn-verify');
  btnVerify.innerText = 'Next Challenge → (Enter)';
  btnVerify.disabled = false;
}

function nextTask() {
  const currentList = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  if (localIndex < currentList.length - 1) {
    localIndex++;
    renderTask();
  } else {
    if (currentQuizMode === 'A') {
      if (confirm('Quiz A completed! Ready to move to Quiz B (Tasks 23-45)?')) {
        switchQuiz('B');
      }
    } else {
      alert(`Congratulations! You completed all 45 tasks! Final Score: ${score} / 45.`);
    }
  }
}

function prevTask() {
  if (localIndex > 0) {
    localIndex--;
    renderTask();
  }
}

function switchQuiz(mode) {
  currentQuizMode = mode;
  localIndex = 0;
  
  if (mode === 'A') {
    document.getElementById('tab-quiz-a').className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition';
    document.getElementById('tab-quiz-b').className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition';
  } else {
    document.getElementById('tab-quiz-b').className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition';
    document.getElementById('tab-quiz-a').className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition';
  }

  renderTask();
}

function showAnswer() {
  const current = getCurrentChallenge();
  selectOption(current.correct);
  verifyAnswer();
  streak = 0;
  document.getElementById('streak-display').innerText = streak;
}

        <p class="text-slate-700">• <strong>Present Result:</strong> <em>"I have lost my passport!" (it is missing right now)</em></p>
        <p class="text-slate-700">• <strong>Immediate Past:</strong> <em>have just finished, recently</em></p>
        <p class="text-slate-700">• <strong>Starting Point / Duration:</strong> <em>since Monday, for ten years (ongoing)</em></p>
      </div>
      <div class="bg-amber-50/70 p-3.5 rounded-2xl border border-amber-200 text-xs text-amber-950">
        <p class="font-bold mb-1">💡 Key Cambridge Rule:</p>
        <p class="leading-relaxed">Never use the Present Perfect with finished past time markers like <em>yesterday</em>, <em>last week</em>, or <em>ago</em>!</p>
      </div>
    `;
  } else {
    content.innerHTML = `
      <div>
        <h3 class="font-bold text-slate-900 text-base mb-1">Past Simple (V2 / did + base form)</h3>
        <p class="text-xs text-slate-600 leading-relaxed">Used for actions completed in a <strong>closed, finished time period</strong>. The connection to the present is completely severed.</p>
      </div>
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
        <p class="font-bold text-slate-900 uppercase tracking-wider text-[11px]">Strict Past Simple Markers:</p>
        <p class="text-slate-700">• <strong>Explicit Past Markers:</strong> <em>yesterday, last month, last autumn</em></p>
        <p class="text-slate-700">• <strong>The "-ago" Law:</strong> <em>two days ago, ten minutes ago</em></p>
        <p class="text-slate-700">• <strong>Specific Dates/Years:</strong> <em>in 2019, in 1845, at 5:00 AM yesterday</em></p>
        <p class="text-slate-700">• <strong>Completed Life Stage:</strong> <em>when I was a student, during his lifetime</em></p>
      </div>
      <div class="bg-blue-50/60 p-3.5 rounded-2xl border border-blue-100 text-xs text-blue-900">
        <p class="font-bold mb-1">Cambridge Formula:</p>
        <p class="font-mono text-slate-700">Subject + Verb-ed / Irregular 2nd form (e.g. discovered, went, held, struck)</p>
      </div>
    `;
  }
  modal.classList.remove('hidden');
};

document.getElementById('btn-close-modal').onclick = () => modal.classList.add('hidden');
document.getElementById('btn-modal-return').onclick = () => modal.classList.add('hidden');
modal.onclick = (e) => { if (e.target === modal) modal.classList.add('hidden'); };

// Initial Load
renderTask();
</script>
</body>
</html>
