// Deterministic option shuffling
const SHUFFLE_OFFSETS = [
  1, 2, 0, 3, 2, 1, 3, 0, 2, 1, 0, 3,
  2, 0, 1, 3, 1, 2, 0, 3, 2, 0, 1, 3,
  0, 2, 1, 3, 2, 0, 1, 3, 1, 2, 0, 3,
  2, 0, 1, 3, 2, 1, 0, 3, 1
];

const processedDataset = rawDataset.map((item, idx) => {
  const correctVal = item.options[0];
  const others = item.options.slice(1);
  const targetIdx = SHUFFLE_OFFSETS[idx % SHUFFLE_OFFSETS.length] % 4;
  const newOpts = [];
  let ptr = 0;
  for (let i = 0; i < 4; i++) {
    if (i === targetIdx) newOpts.push(correctVal);
    else newOpts.push(others[ptr++]);
  }
  return { ...item, options: newOpts, correct: targetIdx };
});

const quizA = processedDataset.slice(0, 22);
const quizB = processedDataset.slice(22, 45);

let currentMode = 'A';
let currentIndex = 0;
let score = 0;
let streak = 0;
let selectedOption = null;
let isAnswerChecked = false;

function getCurrentDataset() {
  return currentMode === 'A' ? quizA : quizB;
}

// Proven British Female Voice Selector & Synthesizer
let britishFemaleVoice = null;
function findBritishFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  const preferredFemaleVoices = [
    'Google UK English Female',
    'Microsoft Libby Online (Natural) - English (United Kingdom)',
    'Microsoft Sonia Online (Natural) - English (United Kingdom)',
    'Microsoft Maisie Online (Natural) - English (United Kingdom)',
    'Serena (Premium)', 'Serena (Enhanced)', 'Serena',
    'Kate (Premium)', 'Kate (Enhanced)', 'Kate',
    'Stephanie (Premium)', 'Stephanie (Enhanced)', 'Stephanie',
    'Fiona', 'Martha', 'Microsoft Susan', 'Microsoft Hazel'
  ];
  for (const name of preferredFemaleVoices) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return found;
  }
  const maleKeywords = ['male', 'george', 'daniel', 'ryan', 'arthur', 'oliver', 'david', 'mark'];
  const enGbFemale = voices.find(v => {
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    const name = (v.name || '').toLowerCase();
    const isUK = lang === 'en-gb' || name.includes('united kingdom') || name.includes('uk english') || name.includes('british');
    return isUK && !maleKeywords.some(m => name.includes(m));
  });
  if (enGbFemale) return enGbFemale;
  const anyGb = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase() === 'en-gb');
  if (anyGb) return anyGb;
  const anyFemaleEnglish = voices.find(v => {
    const name = (v.name || '').toLowerCase();
    const lang = (v.lang || '').toLowerCase();
    return lang.startsWith('en') && !maleKeywords.some(m => name.includes(m));
  });
  if (anyFemaleEnglish) return anyFemaleEnglish;
  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

function speakBritish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-GB';
  utterance.rate = 0.98;
  utterance.pitch = 1.05;
  const voice = britishFemaleVoice || findBritishFemaleVoice();
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}

function getCompletedSentence() {
  const dataset = getCurrentDataset();
  const current = dataset[currentIndex];
  // Replace blanks with "blank" so it does not spoil the answer
  return current.q.replace('___', 'blank');
}

function playSound(type) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;

    if (type === 'success') {
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const g = ctx.createGain();
      osc1.type = 'sine'; osc1.frequency.setValueAtTime(523.25, now); osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
      osc2.type = 'triangle'; osc2.frequency.setValueAtTime(659.25, now + 0.08); osc2.frequency.exponentialRampToValueAtTime(783.99, now + 0.22);
      g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.18, now + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc1.connect(g); osc2.connect(g); g.connect(ctx.destination);
      osc1.start(now); osc2.start(now + 0.08); osc1.stop(now + 0.35); osc2.stop(now + 0.35);
    } else if (type === 'error') {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(260, now); osc.frequency.setValueAtTime(220, now + 0.12);
      g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.16, now + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.28);
    } else if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }
  } catch(e) {}
}

function switchQuizMode(mode) {
  currentMode = mode;
  currentIndex = 0;
  score = 0;
  streak = 0;
  const tabA = document.getElementById('tab-quiz-a');
  const tabB = document.getElementById('tab-quiz-b');
  const sub = document.getElementById('subtitulo-quiz');

  if (mode === 'A') {
    tabA.className = 'py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition shadow-sm bg-white text-indigo-600 cursor-pointer';
    tabB.className = 'py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition text-slate-600 hover:text-indigo-600 cursor-pointer';
    sub.innerText = 'GERUNDS VS INFINITIVES MASTER PRACTICE (QUIZ A)';
  } else {
    tabB.className = 'py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition shadow-sm bg-white text-indigo-600 cursor-pointer';
    tabA.className = 'py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm transition text-slate-600 hover:text-indigo-600 cursor-pointer';
    sub.innerText = 'GERUNDS VS INFINITIVES MASTER PRACTICE (QUIZ B)';
  }
  loadChallenge();
}

function loadChallenge() {
  const dataset = getCurrentDataset();
  if (currentIndex >= dataset.length) {
    showFinalSummary();
    return;
  }
  isAnswerChecked = false;
  selectedOption = null;
  const current = dataset[currentIndex];

  document.getElementById('progreso-texto').innerText = `Task ${currentIndex + 1} of ${dataset.length}`;
  document.getElementById('puntuacion').innerText = `Correct: ${score}`;
  document.getElementById('streak-badge').innerText = `Streak: ${streak}`;

  const pct = Math.round(((currentIndex + 1) / dataset.length) * 100);
  document.getElementById('barra-progreso').style.width = `${pct}%`;

  const btnCat = document.getElementById('btn-categoria');
  btnCat.innerText = (current.category || 'Standard').toUpperCase() + ' (CLICK FOR HINT)';

  const parts = current.q.split('___');
  let qHtml = '';
  if (parts.length === 2) {
    qHtml = `<span>${parts[0]}</span><span id="blank-slot" class="inline-block mx-1.5 px-3 py-0.5 rounded-lg border font-extrabold bg-white text-indigo-600 border-indigo-200/80 shadow-xs align-middle">___</span><span>${parts[1]}</span>`;
  } else {
    qHtml = current.q.replace('___', '<span id="blank-slot" class="inline-block mx-1.5 px-3 py-0.5 rounded-lg border font-extrabold bg-white text-indigo-600 border-indigo-200/80 shadow-xs align-middle">___</span>');
  }
  document.getElementById('pregunta-texto').innerHTML = qHtml;

  const pista = document.getElementById('pista-texto');
  document.getElementById('pista-contenido').innerText = current.h;
  pista.classList.add('hidden');

  const feedbackBox = document.getElementById('feedback-box');
  feedbackBox.className = 'hidden p-5 rounded-2xl mb-6 border transition-all duration-300';

  document.getElementById('btn-verificar').classList.remove('hidden');

  const container = document.getElementById('opciones-contenedor');
  container.innerHTML = '';
  current.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'w-full text-left p-4 rounded-xl border border-slate-200 font-medium text-slate-700 hover:bg-indigo-50 hover:border-indigo-300 transition flex justify-between items-center shadow-xs cursor-pointer bg-white';
    div.innerHTML = `
      <div class="flex items-center justify-between w-full">
        <span class="text-base font-semibold">${opt}</span>
        <input type="radio" name="option" value="${idx}" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 accent-indigo-600 pointer-events-none">
      </div>
    `;
    div.onclick = () => {
      if (isAnswerChecked) return;
      selectedOption = idx;
      playSound('click');
      div.querySelector('input').checked = true;
      Array.from(container.children).forEach(el => el.classList.remove('border-indigo-500', 'bg-indigo-50/50', 'ring-1', 'ring-indigo-500'));
      div.classList.add('border-indigo-500', 'bg-indigo-50/50', 'ring-1', 'ring-indigo-500');
    };
    container.appendChild(div);
  });
}

function verifyAnswer() {
  if (selectedOption === null || isAnswerChecked) return;
  isAnswerChecked = true;
  const dataset = getCurrentDataset();
  const current = dataset[currentIndex];
  const isCorrect = (selectedOption === current.correct);

  if (isCorrect) {
    score++;
    streak++;
    playSound('success');
  } else {
    streak = 0;
    playSound('error');
  }

  const slot = document.getElementById('blank-slot');
  if (slot) {
    slot.innerText = current.options[current.correct];
    slot.className = 'inline-block mx-1.5 px-3 py-0.5 rounded-lg border font-extrabold bg-indigo-100 text-indigo-800 border-indigo-200 align-middle';
  }

  const items = document.getElementById('opciones-contenedor').children;
  Array.from(items).forEach((div, idx) => {
    div.onclick = null;
    const input = div.querySelector('input');
    input.disabled = true;
    if (idx === current.correct) {
      div.className = 'w-full text-left p-4 rounded-xl border-2 border-emerald-500 font-bold text-emerald-800 bg-emerald-50 transition flex justify-between items-center shadow-xs';
    } else if (idx === selectedOption && !isCorrect) {
      div.className = 'w-full text-left p-4 rounded-xl border-2 border-rose-400 font-bold text-rose-800 bg-rose-50 transition flex justify-between items-center shadow-xs';
    } else {
      div.className = 'w-full text-left p-4 rounded-xl border border-slate-100 font-normal text-slate-400 bg-slate-50 opacity-60 flex justify-between items-center cursor-not-allowed';
    }
  });

  const feedbackBox = document.getElementById('feedback-box');
  const feedbackTitulo = document.getElementById('feedback-titulo');
  const feedbackExplicacion = document.getElementById('feedback-explicacion');
  const feedbackAlert = document.getElementById('feedback-alert');
  const feedbackChunk = document.getElementById('feedback-chunk');

  feedbackBox.className = 'p-5 rounded-2xl mb-6 border transition-all duration-300';
  if (isCorrect) {
    feedbackBox.classList.add('bg-emerald-50', 'border-emerald-200');
    feedbackTitulo.innerText = 'Excellent!';
    feedbackTitulo.className = 'font-bold text-lg mb-2 text-emerald-800';
  } else {
    feedbackBox.classList.add('bg-rose-50', 'border-rose-200');
    feedbackTitulo.innerText = 'Key Distinction / Take Note!';
    feedbackTitulo.className = 'font-bold text-lg mb-2 text-rose-800';
  }

  feedbackExplicacion.innerHTML = current.expl;
  feedbackAlert.innerText = current.alert;
  feedbackChunk.innerText = `Chunk: ${current.chunk}`;

  feedbackBox.classList.remove('hidden');
  document.getElementById('btn-verificar').classList.add('hidden');
  document.getElementById('puntuacion').innerText = `Correct: ${score}`;
  document.getElementById('streak-badge').innerText = `Streak: ${streak}`;
}

document.getElementById('btn-verificar').onclick = verifyAnswer;
document.getElementById('btn-siguiente').onclick = () => { currentIndex++; loadChallenge(); };
document.getElementById('btn-anterior').onclick = () => { if (currentIndex > 0) { currentIndex--; loadChallenge(); } };
document.getElementById('btn-categoria').onclick = () => { document.getElementById('pista-texto').classList.toggle('hidden'); };
document.getElementById('btn-pista-inferior').onclick = () => { document.getElementById('pista-texto').classList.toggle('hidden'); };
document.getElementById('btn-mostrar-respuesta').onclick = () => {
  if (isAnswerChecked) return;
  const dataset = getCurrentDataset();
  const current = dataset[currentIndex];
  selectedOption = current.correct;
  const items = document.getElementById('opciones-contenedor').children;
  if (items[current.correct]) items[current.correct].querySelector('input').checked = true;
  verifyAnswer();
};

document.getElementById('btn-restart').onclick = () => { currentIndex = 0; score = 0; streak = 0; loadChallenge(); };
document.getElementById('btn-audio-sentence').onclick = () => { speakBritish(getCompletedSentence()); };

window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!isAnswerChecked) verifyAnswer();
    else { currentIndex++; loadChallenge(); }
  }
});

function showFinalSummary() {
  const dataset = getCurrentDataset();
  const main = document.querySelector('main');
  main.innerHTML = `
    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-200 text-center animate-fade-in overflow-hidden" style="border-top: 8px solid #2563eb;">
      <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl font-bold shadow-inner">🏆</div>

    </div>
  `;
}
