<script>
const rules = {
  "tag-verb": { title: "Verb + Preposition", text: "Verbs that require specific dependent prepositions to establish legal, causal, or spatial relationships.<br><br>• <i>Depend <b>on / upon</b></i> (contingency base).<br>• <i>Insist <b>on / upon</b></i> (sustained focus)." },
  "tag-adjective": { title: "Adjective + Preposition", text: "Adjectives paired with fixed particles to define psychological states, competencies, or directional orientations.<br><br>• <i>Married <b>to</b></i> (relational bond).<br>• <i>Good <b>at</b></i> (point of competence)." },
  "tag-noun": { title: "Noun + Preposition", text: "Nouns linked to prepositions governing institutional trust, environmental risk, or relational connection.<br><br>• <i>A threat <b>to</b></i> (target of risk).<br>• <i>Confidence <b>in</b></i> (domain of trust)." }
};

const quizA = [
  { q: "Whether the new regional branch opens next autumn will strictly depend ___ the board's approval of the revised budget.", a: ["on", "upon"], h: "Visualizes a physical or metaphorical weight resting/leaning on a base.", expl: "<b>Prepositional Governance:</b> <i>depend on / depend upon</i><br><br><b>Lexical Logic:</b> The verb <i>depend</i> strictly governs <b>on</b> or <b>upon</b> to denote reliance or contingency, conceptualizing a condition as a supporting foundation.", tag: "tag-verb" },
  { q: "Despite facing strong opposition from several committee members, the director insisted ___ implementing the new workplace policies immediately.", a: ["on", "upon"], h: "Projects sustained downwards pressure placed on a point of focus.", expl: "<b>Prepositional Governance:</b> <i>insist on / insist upon</i><br><br><b>Lexical Logic:</b> The verb <i>insist</i> requires the preposition <b>on</b> or <b>upon</b> when introducing a gerund or noun phrase, expressing sustained focus or firm determination.", tag: "tag-verb" },
  { q: "The managing editor warmly congratulated the investigative journalist ___ winning the prestigious international press award.", a: ["on"], h: "Visualizes placing praise or a token directly on top of the achievement.", expl: "<b>Prepositional Governance:</b> <i>congratulate [someone] on [something]</i><br><br><b>Lexical Logic:</b> Standard English syntax couples <i>congratulate</i> with <b>on</b> to link praise directly to the specific achievement or occasion.", tag: "tag-verb" },
  { q: "Due to unexpected severe weather conditions, event organizers had no choice but to substitute the outdoor gala ___ a smaller indoor reception.", a: ["for"], h: "Visualizes destination aimed for a target replacement.", expl: "<b>Prepositional Governance:</b> <i>substitute [new item] for [old item]</i><br><br><b>Lexical Logic:</b> When substituting, <b>for</b> marks the item being replaced. Note that <i>substitute A for B</i> means A replaces B.", tag: "tag-verb" },
  { q: "The legal team worked through the night to prevent key evidence ___ being accidentally destroyed during the audit.", a: ["from"], h: "Builds a protective barrier to keep the action away.", expl: "<b>Prepositional Governance:</b> <i>prevent [someone/something] from [gerund]</i><br><br><b>Syntactic Pattern:</b> Verbs of prevention and restraint (e.g., <i>prevent, hinder, stop</i>) systematically require <b>from</b> followed by a gerund clause.", tag: "tag-verb" },
  { q: "The panel of international judges consisted ___ experts drawn from five distinct scientific disciplines.", a: ["of"], h: "Visualizes intrinsic constituent parts making up a whole.", expl: "<b>Prepositional Governance:</b> <i>consist of</i><br><br><b>Lexical Logic:</b> The phrase <i>consist of</i> introduces the intrinsic component parts or members that comprise a whole. Compare with <i>consist in</i> (to reside in as a defining feature).", tag: "tag-verb" },
  { q: "The department manager spent nearly half of the quarterly budget ___ upgrading the office's software infrastructure.", a: ["on"], h: "Views expenditure as laying out funds directly on a surface/project.", expl: "<b>Prepositional Governance:</b> <i>spend [time/money] on [something]</i><br><br><b>Lexical Logic:</b> The verb <i>spend</i> requires <b>on</b> when followed by a noun or gerund object denoting the target of expenditure.", tag: "tag-verb" },
  { q: "After a turbulent negotiation phase, both pharmaceutical companies finally succeeded ___ reaching a mutually beneficial distribution agreement.", a: ["in"], h: "Visualizes operating or arriving in a domain of success.", expl: "<b>Prepositional Governance:</b> <i>succeed in [gerund]</i><br><br><b>Syntactic Pattern:</b> Achieving a goal is expressed by <i>succeed in</i> followed by a gerund, marking the sphere or domain of accomplishment.", tag: "tag-verb" },
  { q: "The regulatory commission accused the pharmaceutical firm ___ deliberately manipulating trial results to accelerate approval.", a: ["of"], h: "Visualizes pulling a charge out of a person's conduct.", expl: "<b>Prepositional Governance:</b> <i>accuse [someone] of [something]</i><br><br><b>Lexical Logic:</b> Verbs of judicial allegation (e.g., <i>accuse, suspect, convict</i>) govern <b>of</b> to link the individual to the charge or offense.", tag: "tag-verb" },
  { q: "Financial advisors strongly discourage their clients ___ making speculative investments during periods of high market volatility.", a: ["from"], h: "Visualizes steering motion away from a trajectory.", expl: "<b>Prepositional Governance:</b> <i>discourage [someone] from [gerund]</i><br><br><b>Syntactic Pattern:</b> <i>Discourage</i> takes an object + <b>from</b> + gerund to express dissuasion; it does not take a to-infinitive complement.", tag: "tag-verb" },
  { q: "Political leaders were sternly warned not to interfere ___ the independent judicial proceedings of the international tribunal.", a: ["with", "in"], h: "Coming into friction alongside an ongoing process, disturbing its flow.", expl: "<b>Prepositional Governance:</b> <i>interfere with / interfere in</i><br><br><b>Lexical Logic:</b> <i>Interfere with</i> denotes causing obstruction or disruption to a process, while <i>interfere in</i> highlights unwarranted meddling in an affair.", tag: "tag-verb" },
  { q: "The architecture of the newly constructed museum strikingly reminds visitors ___ the historical monuments of ancient Rome.", a: ["of"], h: "Draws a memory out of the source object.", expl: "<b>Prepositional Governance:</b> <i>remind [someone] of [something]</i><br><br><b>Lexical Logic:</b> To evoke a memory of resemblance or association, <i>remind</i> requires <b>of</b> to connect the stimulus to the recalled subject.", tag: "tag-verb" },
  { q: "Many rural communities across the region continue to suffer ___ a severe lack of modern healthcare infrastructure.", a: ["from"], h: "Visualizes distress emanating from an external condition.", expl: "<b>Prepositional Governance:</b> <i>suffer from</i><br><br><b>Lexical Logic:</b> The verb <i>suffer</i> governs <b>from</b> when indicating the origin or cause of chronic hardship, illness, or disadvantage.", tag: "tag-verb" },
  { q: "During the press conference, the spokesperson refused to comment ___ the ongoing police investigation.", a: ["on", "upon"], h: "Visualizes focusing remarks directly on top of a subject surface.", expl: "<b>Prepositional Governance:</b> <i>comment on / comment upon</i><br><br><b>Lexical Logic:</b> In standard English, the verb <i>comment</i> requires the preposition <b>on</b> (or <b>upon</b>) to introduce the subject matter of discourse.", tag: "tag-verb" },
  { q: "The lead researcher spent months attempting to approve ___ the proposed ethical guidelines for human trials.", a: ["of"], h: "Extracting a favorable evaluation out of something.", expl: "<b>Prepositional Governance:</b> <i>approve of</i><br><br><b>Lexical Logic:</b> <i>Approve of</i> denotes personal endorsement or favorable opinion, whereas transitive <i>approve</i> signifies official sanction or formal authorisation.", tag: "tag-verb" },
  { q: "After twenty years of dedicated research, the immunologist is effectively married ___ her groundbreaking work on autoimmune diseases.", a: ["to"], h: "Conceptualizes a directional connection or bond targeted to another entity.", expl: "<b>Prepositional Governance:</b> <i>married to</i><br><br><b>Lexical Logic:</b> The adjective <i>married</i> takes <b>to</b> to specify the partner, institution, or devotion bound by the relationship.", tag: "tag-adjective" },
  { q: "She has always been exceptionally good ___ synthesizing complex statistical data into actionable business insights.", a: ["at"], h: "Pinpoints a precise target coordinate where skill is applied.", expl: "<b>Prepositional Governance:</b> <i>good at / adept at</i><br><br><b>Lexical Logic:</b> Ability adjectives (e.g., <i>good, adept, brilliant, skilled</i>) govern <b>at</b> to pinpoint the specific area of competence or skill.", tag: "tag-adjective" },
  { q: "The corporate board remained remarkably indifferent ___ the growing public criticism regarding their environmental record.", a: ["to"], h: "Establishes an orientation aimed to an external stimulus showing zero responsiveness.", expl: "<b>Prepositional Governance:</b> <i>indifferent to</i><br><br><b>Lexical Logic:</b> The adjective <i>indifferent</i> takes <b>to</b> to designate the recipient or stimulus toward which apathy or lack of concern is directed.", tag: "tag-adjective" },
  { q: "Unregulated industrial runoff is directly responsible ___ the catastrophic decline in local freshwater fish populations.", a: ["for"], h: "Visualizes standing in front of or answering for a consequence.", expl: "<b>Prepositional Governance:</b> <i>responsible for</i><br><br><b>Lexical Logic:</b> <i>Responsible</i> governs <b>for</b> when identifying the cause, duty, or agent accountable for an outcome.", tag: "tag-adjective" },
  { q: "Deeply absorbed ___ his research on quantum computing, the theoretical physicist completely lost track of time.", a: ["in"], h: "Visualizes complete immersion or containment in a liquid or surrounding medium.", expl: "<b>Prepositional Governance:</b> <i>absorbed in</i><br><br><b>Lexical Logic:</b> The state of mental immersion or complete mental engagement is metaphorically framed using <b>in</b>.", tag: "tag-adjective" },
  { q: "Senior corporate executives must be fully aware ___ the potential geopolitical risks before finalizing the multi-billion dollar merger.", a: ["of"], h: "Visualizes conscious knowledge radiating out of a reality.", expl: "<b>Prepositional Governance:</b> <i>aware of</i><br><br><b>Lexical Logic:</b> Cognition adjectives such as <i>aware</i> and <i>conscious</i> take <b>of</b> to complement the object of perception.", tag: "tag-adjective" },
  { q: "The new AI processing unit is capable ___ executing billions of complex mathematical calculations per millisecond.", a: ["of"], h: "Measures potential capacity stemming out of an entity.", expl: "<b>Prepositional Governance:</b> <i>capable of [gerund]</i><br><br><b>Syntactic Pattern:</b> <i>Capable</i> takes <b>of</b> followed by a gerund clause to denote potential or capacity; it does not complement with a to-infinitive.", tag: "tag-adjective" }
];

const quizB = [
  { q: "Environmental analysts were sharply critical ___ the government's decision to subsidize fossil fuel extraction.", a: ["of"], h: "Directs evaluation or judgment coming out of an observer onto a subject.", expl: "<b>Prepositional Governance:</b> <i>critical of</i><br><br><b>Lexical Logic:</b> Evaluative adjectives expressing disapproval (e.g., <i>critical, mistrustful, suspicious</i>) regularly govern <b>of</b>.", tag: "tag-adjective" },
  { q: "The selection tribunal found that the interviewing panel had been unfairly prejudiced ___ candidates from non-traditional backgrounds.", a: ["against"], h: "Projects a hostile force or barrier leaning directly against a target.", expl: "<b>Prepositional Governance:</b> <i>prejudiced against</i><br><br><b>Lexical Logic:</b> Adjectives denoting bias or opposition take <b>against</b> (e.g., <i>prejudiced against, biased against</i>) to mark the target of hostility.", tag: "tag-adjective" },
  { q: "Modern optical sensors are extraordinarily sensitive ___ minor variations in ambient environmental light.", a: ["to"], h: "Projects receptivity pointing to an incoming stimulus or signal.", expl: "<b>Prepositional Governance:</b> <i>sensitive to</i><br><br><b>Lexical Logic:</b> <i>Sensitive</i> requires <b>to</b> to indicate responsiveness or susceptibility to external stimuli or environmental changes.", tag: "tag-adjective" },
  { q: "Although he was deeply disappointed ___ the election results, the candidate delivered a gracious concession speech.", a: ["with", "at", "by"], h: "Visualizes being accompanied or impacted by an unsatisfactory outcome.", expl: "<b>Prepositional Governance:</b> <i>disappointed with / at / by</i><br><br><b>Lexical Logic:</b> Emotional reaction adjectives accept <b>with</b> (for objects/results), <b>at</b>, or <b>by</b> (for events/causes) to connect feeling with source.", tag: "tag-adjective" },
  { q: "Young entrepreneurs are often obsessed ___ finding scalable business models before establishing steady revenue.", a: ["with"], h: "Visualizes a mental fixation that lingers constantly alongside a person.", expl: "<b>Prepositional Governance:</b> <i>obsessed with</i><br><br><b>Lexical Logic:</b> The adjective <i>obsessed</i> governs <b>with</b> to mark the idea, entity, or goal occupying mental focus.", tag: "tag-adjective" },
  { q: "The candidate's extensive international experience makes her uniquely suited ___ the diplomatic post in Geneva.", a: ["to", "for"], h: "Visualizes a tailored fit pointing directional alignment to a position.", expl: "<b>Prepositional Governance:</b> <i>suited to / suited for</i><br><br><b>Lexical Logic:</b> <i>Suited</i> couples with <b>to</b> (matching quality) or <b>for</b> (purpose/role) to express appropriateness or alignment.", tag: "tag-adjective" },
  { q: "After working twelve-hour shifts for six consecutive weeks, the medical staff became thoroughly tired ___ administrative delays.", a: ["of"], h: "Visualizes physical or mental exhaustion stemming out of a repetitive situation.", expl: "<b>Prepositional Governance:</b> <i>tired of</i><br><br><b>Lexical Logic:</b> Idiomatic expressions of impatience or exhaustion (e.g., <i>tired of, sick of</i>) require <b>of</b> before the source of annoyance.", tag: "tag-adjective" },
  { q: "The lead developer was extremely proud ___ the team's ability to deploy the software patch without any server downtime.", a: ["of"], h: "Visualizes pride radiating out of an achievement or person.", expl: "<b>Prepositional Governance:</b> <i>proud of</i><br><br><b>Lexical Logic:</b> The adjective <i>proud</i> takes <b>of</b> to specify the achievement, quality, or person that is the source of pride.", tag: "tag-adjective" },
  { q: "Rising ocean temperatures pose an immediate and severe threat ___ coastal marine ecosystems worldwide.", a: ["to"], h: "Visualizes a directed vector or arrow pointing to a target that receives impact.", expl: "<b>Prepositional Governance:</b> <i>a threat to</i><br><br><b>Lexical Logic:</b> Nouns indicating risk or hazard (e.g., <i>threat, danger, risk</i>) govern <b>to</b> to designate the vulnerable entity.", tag: "tag-noun" },
  { q: "Financial institutions operating within the European Union must strictly maintain compliance ___ updated anti-money laundering regulations.", a: ["with"], h: "Visualizes moving or acting alongside in harmony/company with a set of rules.", expl: "<b>Prepositional Governance:</b> <i>compliance with</i><br><br><b>Lexical Logic:</b> Abstract nouns derived from verbs of adherence (<i>comply → compliance</i>) require <b>with</b> to specify the rules or standards.", tag: "tag-noun" },
  { q: "Throughout the prolonged crisis, the chief negotiator demonstrated an extraordinary capacity ___ maintaining calm under extreme pressure.", a: ["for"], h: "Visualizes an internal space or volume built for carrying out a purpose.", expl: "<b>Prepositional Governance:</b> <i>capacity for [noun/gerund]</i><br><br><b>Lexical Logic:</b> The noun <i>capacity</i> takes <b>for</b> when referring to potential for an activity or skill (e.g., <i>capacity for hard work</i>).", tag: "tag-noun" },
  { q: "Public confidence ___ the domestic banking system plummeted following the unexpected collapse of two major lenders.", a: ["in"], h: "Visualizes trust anchored deep inside an institution or person.", expl: "<b>Prepositional Governance:</b> <i>confidence in</i><br><br><b>Lexical Logic:</b> Nouns denoting trust and psychological reliance (e.g., <i>confidence, faith, belief</i>) govern <b>in</b>.", tag: "tag-noun" },
  { q: "The minister faced widespread criticism ___ his handling of the emergency evacuation during the recent flash floods.", a: ["of"], h: "Links the critique as belonging to or originating out of the target's actions.", expl: "<b>Prepositional Governance:</b> <i>criticism of</i><br><br><b>Lexical Logic:</b> The noun <i>criticism</i> governs <b>of</b> when identifying the subject, behavior, or policy undergoing evaluation.", tag: "tag-noun" },
  { q: "The university has earned an enviable international reputation ___ academic excellence in biotechnology research.", a: ["for"], h: "Visualizes standing or renown awarded for a specific trait or achievement.", expl: "<b>Prepositional Governance:</b> <i>reputation for</i><br><br><b>Lexical Logic:</b> The noun <i>reputation</i> takes <b>for</b> to specify the distinguishing quality or achievement for which someone is known.", tag: "tag-noun" },
  { q: "Rebuilding consumer trust ___ autonomous vehicle technology will require years of verified safety data.", a: ["in"], h: "Visualizes placing faith securely inside a system or person.", expl: "<b>Prepositional Governance:</b> <i>trust in</i><br><br><b>Lexical Logic:</b> The noun <i>trust</i> governs <b>in</b> to indicate the object or system in which confidence is placed.", tag: "tag-noun" },
  { q: "The keynote speaker paid close attention ___ the audience's non-verbal reactions throughout her lecture.", a: ["to"], h: "Visualizes directing cognitive focus pointing to a target.", expl: "<b>Prepositional Governance:</b> <i>attention to</i><br><br><b>Lexical Logic:</b> Collocations with <i>attention</i> (e.g., <i>pay attention, turn attention</i>) require <b>to</b> to mark the focus of awareness.", tag: "tag-noun" },
  { q: "Despite the lack of empirical evidence, the community held an unwavering belief ___ the traditional healing methods.", a: ["in"], h: "Visualizes conviction residing deep inside a core principle or entity.", expl: "<b>Prepositional Governance:</b> <i>belief in</i><br><br><b>Lexical Logic:</b> The noun <i>belief</i> takes <b>in</b> to state conviction regarding the existence, truth, or efficacy of a concept.", tag: "tag-noun" },
  { q: "The team encountered immense difficulty ___ obtaining the necessary permits from the local municipal council.", a: ["in", "with"], h: "Visualizes experiencing friction inside an ongoing process or task.", expl: "<b>Prepositional Governance:</b> <i>difficulty in / difficulty with</i><br><br><b>Lexical Logic:</b> <i>Difficulty</i> takes <b>in</b> followed by a gerund (an area of struggle) or <b>with</b> followed by a noun phrase.", tag: "tag-noun" },
  { q: "The committee held a lengthy discussion ___ the economic implications of the proposed tariff increases.", a: ["about", "on"], h: "Visualizes surrounding or encompassing a topic from all sides.", expl: "<b>Prepositional Governance:</b> <i>discussion about / discussion on</i><br><br><b>Lexical Logic:</b> Nouns of deliberation (e.g., <i>discussion, debate</i>) take <b>about</b> or <b>on</b> to designate the subject matter.", tag: "tag-noun" },
  { q: "Having previous experience ___ managing cross-functional remote teams is an essential prerequisite for this position.", a: ["in", "of"], h: "Visualizes possessing practical wisdom acquired inside a domain or field.", expl: "<b>Prepositional Governance:</b> <i>experience in / experience of</i><br><br><b>Lexical Logic:</b> The noun <i>experience</i> governs <b>in</b> (field/activity) or <b>of</b> (specific event/phenomenon) to denote practical involvement.", tag: "tag-noun" },
  { q: "The white paper provides valuable information ___ the latest regulatory changes affecting renewable energy projects.", a: ["on", "about"], h: "Visualizes data or knowledge resting directly on top of a subject area.", expl: "<b>Prepositional Governance:</b> <i>information on / information about</i><br><br><b>Lexical Logic:</b> <i>Information</i> connects to its subject via <b>on</b> (formal/detailed topic) or <b>about</b> (general topic).", tag: "tag-noun" },
  { q: "Engineers are currently working to solve the systemic problem ___ recurring voltage fluctuations in the power grid.", a: ["of", "with"], h: "Links the defect as belonging directly to the system.", expl: "<b>Prepositional Governance:</b> <i>problem of / problem with</i><br><br><b>Lexical Logic:</b> The noun <i>problem</i> links via <b>of</b> (defining the specific nature of the issue) or <b>with</b> (identifying the faulty entity).", tag: "tag-noun" },
  { q: "There is an urgent need for more research into the relationship ___ environmental stress and cognitive performance.", a: ["between"], h: "Visualizes a conceptual bridge spanning the space between two distinct entities.", expl: "<b>Prepositional Governance:</b> <i>relationship between</i><br><br><b>Lexical Logic:</b> <i>Relationship</i> requires <b>between</b> when connecting two distinct variables or entities.", tag: "tag-noun" }
];

let currentQuizType = 'A';
let currentData = quizA;
let idx = 0;
let streak = 0;
let score = 0;
let solvedThisIdx = false;

function openModal() {
  const tag = currentData[idx].tag;
  document.getElementById('modalTitle').innerText = rules[tag].title;
  document.getElementById('modalText').innerHTML = rules[tag].text;
  document.getElementById('ruleModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('ruleModal').style.display = 'none';
}

function update() {
  if (idx >= currentData.length) {
    document.getElementById('final-screen').style.display = 'flex';
    document.getElementById('final-stats').innerText = `Tasks completed: ${score}/${currentData.length} | Streak: ${streak}`;
    return;
  }
  const card = currentData[idx];
  document.getElementById('q').innerText = card.q;
  document.getElementById('a').innerText = "Accepted: " + card.a.join(' / ');
  document.getElementById('expl').innerHTML = "<span class='explanation-header'>Prepositional Governance & Usage:</span>" + card.expl;
  let tagName = card.tag.split('-')[1].toUpperCase();
  document.getElementById('tagDisplay').innerHTML = `<span class="type-tag ${card.tag}">${tagName} (Click for Category ℹ️)</span>`;
  document.getElementById('a').classList.remove('visible');
  document.getElementById('expl').classList.remove('visible');
  document.getElementById('hintBox').classList.remove('visible');
  document.getElementById('feedback').innerText = '';
  document.getElementById('userInput').value = '';
  document.getElementById('pg').innerText = `Task ${idx + 1} of ${currentData.length}`;
  solvedThisIdx = false;
  document.getElementById('pBtn').disabled = idx === 0;
}

function checkAnswer() {
  const u = document.getElementById('userInput').value.toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();
  if(!u) return;
  const card = currentData[idx];
  const isCorrect = card.a.some(ans => {
    const normalizedAns = ans.toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();
    return u === normalizedAns;
  });

  if (isCorrect) {
    document.getElementById('feedback').innerText = "CORRECT! ✨";
    document.getElementById('feedback').className = 'correct';
    document.getElementById('a').classList.add('visible');
    document.getElementById('expl').classList.add('visible');
    if (!solvedThisIdx) { streak++; score++; solvedThisIdx = true; }
  } else {
    document.getElementById('feedback').innerText = "TRY AGAIN ❌";
    document.getElementById('feedback').className = 'wrong';
    streak = 0;
  }
  document.getElementById('streak-count').innerText = `Streak: ${streak}`;
  document.getElementById('score-display').innerText = `Correct: ${score}`;
}

function showHint() {
  document.getElementById('hintBox').innerText = "💡 " + currentData[idx].h;
  document.getElementById('hintBox').classList.add('visible');
}

function revealAnswer() {
  document.getElementById('a').classList.add('visible');
  document.getElementById('expl').classList.add('visible');
  streak = 0;
  document.getElementById('streak-count').innerText = `Streak: 0`;
}

function next() {
  if (idx < currentData.length - 1) {
    idx++;
    update();
  } else {
    idx++;
    update();
  }
}

function prev() {
  if (idx > 0) {
    idx--;
    update();
  }
}

function switchQuiz(type) {
  currentQuizType = type;
  currentData = (type === 'A') ? quizA : quizB;
  idx = 0;
  score = 0;
  streak = 0;
  solvedThisIdx = false;
  document.getElementById("tabA").className = (type === 'A') ? "tab-btn active" : "tab-btn";
  document.getElementById("tabB").className = (type === 'B') ? "tab-btn active" : "tab-btn";
  document.getElementById("subTitle").innerText = `Advanced Dependent Prepositions Practice (Quiz ${type})`;
  document.getElementById('final-screen').style.display = 'none';
  update();
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') checkAnswer();
});

update();
</script>

</body>
</html>
