<script>    
    const rules = {        
        "tag-verb": { title: "Estructura del Present Perfect", text: "Verbos que requieren el aspecto Present Perfect Simple o Continuous para conectar un punto de origen pasado con la continuidad presente, evitando los errores habituales de interferencia del español.<br><br>• <i>Has worked for</i> (Duración acumulada).<br>• <i>Has been since</i> (Punto de inicio en el tiempo)." }
    };    

    const quizA = [
        { q: "Dr. Aris ___ [work] at the research institute for over twelve years, leading groundbreaking work on genomic sequencing.", a: ["has worked", "has been working"], h: "Visualiza una acción originada en el pasado que se extiende de forma continua hasta el presente a lo largo de un período acumulado.", expl: "<b>Formas Aceptadas:</b> <i>has worked / has been working</i><br><br><b>Significado y Contraste:</b> En español solemos usar el presente simple ('trabaja desde hace'), pero el inglés exige el Present Perfect para conectar la duración marcada por 'for'. Se acepta el aspecto simple o el continuo segun el énfasis.", tag: "tag-verb" },
        { q: "The international trade alliance ___ [be] in effect since January 2020, boosting bilateral exports across Europe.", a: ["has been"], h: "Conecta un estado continuo directamente a una fecha fija de inicio.", expl: "<b>Formas Aceptadas:</b> <i>has been</i><br><br><b>Significado y Contraste:</b> Al haber un punto fijo inicial introducido por 'since' ('desde enero de 2020'), el inglés exige 'has been', descartando la interferencia del presente ('está en vigor desde').", tag: "tag-verb" },
        { q: "Our senior engineering team ___ [work] on this aerospace project for six consecutive months without a single day off.", a: ["has worked", "has been working", "have worked", "have been working"], h: "Enfócate en la actividad continua prolongada a lo largo de seis meses.", expl: "<b>Formas Aceptadas:</b> <i>has worked / has been working / have worked / have been working</i><br><br><b>Significado y Contraste:</b> Se aceptan concordancias tanto en singular como en colectivo (plural), prefiriéndose el aspecto continuo para recalcar la duración acumulada.", tag: "tag-verb" },
        { q: "The chief executive officer ___ [be] in charge of corporate communications since the restructuring took place.", a: ["has been"], h: "Enlaza el cargo continuo al evento del pasado que sirvió de punto de partida.", expl: "<b>Formas Aceptadas:</b> <i>has been</i><br><br><b>Significado y Contraste:</b> La presencia de 'since' vinculada al evento pasado obliga a utilizar 'has been' en la oración principal.", tag: "tag-verb" },
        { q: "Global stock markets ___ [experience] remarkable volatility for the past three fiscal quarters.", a: ["have experienced", "have been experiencing"], h: "Mide la fluctuación a lo largo de un intervalo de tiempo que se extiende hasta hoy.", expl: "<b>Formas Aceptadas:</b> <i>have experienced / have been experiencing</i><br><br><b>Significado y Contraste:</b> Tanto el aspecto simple como el continuo son perfectamente válidos para abarcar los últimos tres trimestres fiscales.", tag: "tag-verb" },
        { q: "Professor Harrison ___ [teach] economic policy at Oxford University since he published his seminal treatise in 2015.", a: ["has taught", "has been teaching"], h: "Traza la trayectoria académica desde el año de publicación hasta la actualidad.", expl: "<b>Formas Aceptadas:</b> <i>has taught / has been teaching</i><br><br><b>Significado y Contraste:</b> 'Since' fija el punto de origen en 2015, exigiendo el Present Perfect en la cláusula principal.", tag: "tag-verb" },
        { q: "The pharmaceutical board ___ [review] the clinical trial data for two weeks, but no official verdict has been released.", a: ["has reviewed", "has been reviewing", "have reviewed", "have been reviewing"], h: "Enfatiza el proceso activo de revisión llevado a cabo durante dos semanas.", expl: "<b>Formas Aceptadas:</b> <i>has reviewed / has been reviewing / have reviewed / have been reviewing</i><br><br><b>Significado y Contraste:</b> Se admite concordancia singular/plural e idéntico valor funcional entre el aspecto simple y continuo.", tag: "tag-verb" },
        { q: "Ever since the regulatory reforms were enacted, compliance officers ___ [maintain] strict oversight across all branches.", a: ["have maintained", "have been maintaining"], h: "Relaciona la supervisión continua con el momento exacto en que se aprobaron las reformas.", expl: "<b>Formas Aceptadas:</b> <i>have maintained / have been maintaining</i><br><br><b>Significado y Contraste:</b> 'Ever since' actúa como desencadenante directo del Present Perfect para mostrar una continuidad sin interrupciones.", tag: "tag-verb" },
        { q: "The historic hotel ___ [be] owned by the same founding family for more than a century.", a: ["has been"], h: "Expresa un estado de propiedad ininterrumpido durante cien años.", expl: "<b>Formas Aceptadas:</b> <i>has been</i><br><br><b>Significado y Contraste:</b> Como el verbo 'own' o el estado 'be owned' describe una condición estática, se requiere 'has been'.", tag: "tag-verb" },
        { q: "Renewable energy investments ___ [grow] rapidly across Scandinavian nations since the dawn of the decade.", a: ["have grown", "have been growing"], h: "Sigue la curva de crecimiento partiendo del hito temporal de inicio de la década.", expl: "<b>Formas Aceptadas:</b> <i>have grown / have been growing</i><br><br><b>Significado y Contraste:</b> Ambos aspectos son válidos para describir una tendencia ascendente iniciada en un punto de referencia 'since'.", tag: "tag-verb" },
        { q: "The software development firm ___ [upgrade] its core server infrastructure for nearly five hours.", a: ["has been upgrading", "has upgraded"], h: "Representa una tarea técnica continua medida a lo largo de un intervalo de cinco horas.", expl: "<b>Formas Aceptadas:</b> <i>has been upgrading / has upgraded</i><br><br><b>Significado y Contraste:</b> En inglés se evita usar 'carry' o el presente simple para duración; se recurre al Present Perfect con 'for'.", tag: "tag-verb" },
        { q: "Public interest in autonomous transportation ___ [increase] significantly since the international motor show.", a: ["has increased", "has been increasing"], h: "Identifica el aumento de interés iniciado a partir del evento del salón del automóvil.", expl: "<b>Formas Aceptadas:</b> <i>has increased / has been increasing</i><br><br><b>Significado y Contraste:</b> 'Since' vincula el cambio de tendencia con el evento pasado, requiriendo Present Perfect.", tag: "tag-verb" },
        { q: "The lead archeologist ___ [direct] artifact excavations in the Valley of the Kings for three consecutive seasons.", a: ["has directed", "has been directing"], h: "Describe la dirección profesional desarrollada a lo largo de varias campañas.", expl: "<b>Formas Aceptadas:</b> <i>has directed / has been directing</i><br><br><b>Significado y Contraste:</b> El aspecto continuo acentúa el desarrollo ininterrumpido de las campañas de excavación.", tag: "tag-verb" },
        { q: "Substantial funding for urban reforestation ___ [be] available since the green initiative was approved.", a: ["has been"], h: "Indica la disponibilidad presupuestaria continua tras la aprobación de la iniciativa.", expl: "<b>Formas Aceptadas:</b> <i>has been</i><br><br><b>Significado y Contraste:</b> Estado de disponibilidad vigente conectado al momento de la aprobación mediante 'since'.", tag: "tag-verb" },
        { q: "The diplomatic envoys ___ [negotiate] peaceful resolution strategies for four grueling weeks.", a: ["have negotiated", "have been negotiating"], h: "Destaca la duración de las conversaciones diplomáticas acumulada hasta hoy.", expl: "<b>Formas Aceptadas:</b> <i>have negotiated / have been negotiating</i><br><br><b>Significado y Contraste:</b> Cuantificación de un proceso activo acumulado mediante la partícula 'for'.", tag: "tag-verb" },
        { q: "Dr. Vance ___ [write] a column on behavioral economics for the Sunday Times since last summer.", a: ["has written", "has been writing"], h: "Refiere una labor periodística continuada que comenzó el verano pasado.", expl: "<b>Formas Aceptadas:</b> <i>has written / has been writing</i><br><br><b>Significado y Contraste:</b> 'Since last summer' establece el origen de la colaboración activa.", tag: "tag-verb" },
        { q: "The environmental agency ___ [monitor] atmospheric carbon levels in the region for twenty-five years.", a: ["has monitored", "has been monitoring"], h: "Centra la atención en el seguimiento científico desarrollado durante un cuarto de siglo.", expl: "<b>Formas Aceptadas:</b> <i>has monitored / has been monitoring</i><br><br><b>Significado y Contraste:</b> Duración de 25 años medida mediante 'for', compatible con aspecto simple o continuo.", tag: "tag-verb" },
        { q: "Automotive battery technology ___ [see] unprecedented advancements since the breakthrough in solid-state cells.", a: ["has seen", "has undergone", "has experienced"], h: "Enlaza la evolución tecnológica con el hallazgo científico que la desencadenó.", expl: "<b>Formas Aceptadas:</b> <i>has seen / has undergone / has experienced</i><br><br><b>Significado y Contraste:</b> Se aceptan verbos afines que expresan la vivencia del avance tecnológico desde el hito inicial.", tag: "tag-verb" },
        { q: "The regional hospital system ___ [struggle] with severe staffing shortages for several months.", a: ["has struggled", "has been struggling"], h: "Describe una dificultad operativa prolongada a lo largo de los últimos meses.", expl: "<b>Formas Aceptadas:</b> <i>has struggled / has been struggling</i><br><br><b>Significado y Contraste:</b> Situación de esfuerzo o dificultad medida con 'for' hasta el momento presente.", tag: "tag-verb" },
        { q: "Our company headquarters ___ [be] located in Frankfurt since the corporate merger in 2012.", a: ["have been", "has been"], h: "Señala la ubicación geográfica permanente establecida tras la fusión de 2012.", expl: "<b>Formas Aceptadas:</b> <i>has been / have been</i><br><br><b>Significado y Contraste:</b> Estado estático de localización vinculado al año histórico mediante 'since'.", tag: "tag-verb" },
        { q: "The investigative journalist ___ [investigate] the offshore banking network for nearly a year.", a: ["has investigated", "has been investigating"], h: "Mide la investigación periodística activa acumulada cerca de doce meses.", expl: "<b>Formas Aceptadas:</b> <i>has investigated / has been investigating</i><br><br><b>Significado y Contraste:</b> Uso de 'for' para cuantificar la duración ininterrumpida del trabajo de investigación.", tag: "tag-verb" },
        { q: "Heavy snowstorms ___ [disrupt] travel across the alpine passes since early yesterday morning.", a: ["have disrupted", "have been disrupting"], h: "Relaciona las complicaciones en el transporte con la tormenta desatada ayer.", expl: "<b>Formas Aceptadas:</b> <i>have disrupted / have been disrupting</i><br><br><b>Significado y Contraste:</b> 'Since' señala el límite temporal de inicio de las perturbaciones del tráfico.", tag: "tag-verb" }
    ];

    const quizB = [
        { q: "The non-profit foundation ___ [provide] food relief to refugee camps for over half a decade.", a: ["has provided", "has been providing"], h: "Cuantifica la labor humanitaria mantenida a lo largo de cinco años.", expl: "<b>Formas Aceptadas:</b> <i>has provided / has been providing</i><br><br><b>Significado y Contraste:</b> Present Perfect combinado con 'for' para expresar asistencia sostenida.", tag: "tag-verb" },
        { q: "Tensions between the negotiating factions ___ [ease] noticeably since the press conference concluded.", a: ["have eased", "have been easing"], h: "Muestra una mejoría progresiva iniciada tras la rueda de prensa.", expl: "<b>Formas Aceptadas:</b> <i>have eased / have been easing</i><br><br><b>Significado y Contraste:</b> El fin de la rueda de prensa actúa como el ancla 'since' que exige Present Perfect.", tag: "tag-verb" },
        { q: "The legal department ___ [scrutinize] the contract draft for three business days without reaching a conclusion.", a: ["has scrutinized", "has been scrutinizing", "have scrutinized", "have been scrutinizing"], h: "Mide el análisis jurídico riguroso desarrollado durante tres días laborables.", expl: "<b>Formas Aceptadas:</b> <i>has scrutinized / has been scrutinizing / have scrutinized / have been scrutinizing</i><br><br><b>Significado y Contraste:</b> Admite singular/plural y matiz simple/continuo para la revisión técnica.", tag: "tag-verb" },
        { q: "The museum's rare manuscript collection ___ [be] on public display since the ceremonial opening.", a: ["has been"], h: "Refiere la exhibición pública continuada desde la ceremonia de inauguración.", expl: "<b>Formas Aceptadas:</b> <i>has been</i><br><br><b>Significado y Contraste:</b> Estado de exposición vinculado a la fecha de apertura mediante 'since'.", tag: "tag-verb" },
        { q: "Financial analysts ___ [debate] the potential economic fallout of the new policy for weeks.", a: ["have debated", "have been debating"], h: "Destaca la discusión activa sostenida durante varias semanas.", expl: "<b>Formas Aceptadas:</b> <i>have debated / have been debating</i><br><br><b>Significado y Contraste:</b> Proceso deliberativo acumulado medido con 'for'.", tag: "tag-verb" },
        { q: "Cybersecurity defense systems ___ [be] automatically updated every hour since the malware threat emerged.", a: ["have been"], h: "Alude a las actualizaciones automáticas puestas en marcha tras la amenaza informática.", expl: "<b>Formas Aceptadas:</b> <i>have been</i><br><br><b>Significado y Contraste:</b> Voz pasiva en Present Perfect desencadenada por la cláusula con 'since'.", tag: "tag-verb" },
        { q: "The theatrical production company ___ [conduct] rehearsals for the broadway revival for two months.", a: ["has conducted", "has been conducting"], h: "Cuantifica los ensayos artísticos activos mantenidos durante sesenta días.", expl: "<b>Formas Aceptadas:</b> <i>has conducted / has been conducting</i><br><br><b>Significado y Contraste:</b> Desarrollo ininterrumpido de ensayos marcado por 'for'.", tag: "tag-verb" },
        { q: "Architectural plans for the new transport hub ___ [be] under official review since last November.", a: ["have been"], h: "Indica el estado administrativo de revisión originado en noviembre pasado.", expl: "<b>Formas Aceptadas:</b> <i>have been</i><br><br><b>Significado y Contraste:</b> 'Since last November' marca la fecha exacta de inicio del trámite.", tag: "tag-verb" },
        { q: "The research team ___ [collect] sample data from deep-sea trenches for several weeks.", a: ["has collected", "has been collecting"], h: "Mide la recogida de muestras realizada a lo largo de varias semanas de expedición.", expl: "<b>Formas Aceptadas:</b> <i>has collected / has been collecting</i><br><br><b>Significado y Contraste:</b> Recopilación de datos acumulada medida mediante 'for'.", tag: "tag-verb" },
        { q: "Consumer confidence in the banking sector ___ [remain] steady since the government guarantee was announced.", a: ["has remained"], h: "Muestra la estabilidad del nivel de confianza partiendo del anuncio del gobierno.", expl: "<b>Formas Aceptadas:</b> <i>has remained</i><br><br><b>Significado y Contraste:</b> Verbo de estado de permanencia vinculado a 'since'.", tag: "tag-verb" },
        { q: "The committee members ___ [discuss] the proposed zoning amendments for hours without reaching consensus.", a: ["have discussed", "have been discussing"], h: "Enfatiza la deliberación continua de los miembros durante horas.", expl: "<b>Formas Aceptadas:</b> <i>have discussed / have been discussing</i><br><br><b>Significado y Contraste:</b> Debates ininterrumpidos en el tiempo evaluados con 'for'.", tag: "tag-verb" },
        { q: "High-speed rail connectivity ___ [transform] regional commerce across the province since its launch in 2018.", a: ["has transformed", "has been transforming"], h: "Sigue la transformación comercial desde la inauguración del servicio ferroviario.", expl: "<b>Formas Aceptadas:</b> <i>has transformed / has been transforming</i><br><br><b>Significado y Contraste:</b> 'Since 2018' fija el año de inicio del impacto en la conectividad.", tag: "tag-verb" },
        { q: "The chief archivist ___ [catalog] rare historical manuscripts for the national library for over a decade.", a: ["has cataloged", "has been cataloging", "has catalogued", "has been cataloguing"], h: "Cuantifica una tarea profesional especializada desarrollada durante diez años.", expl: "<b>Formas Aceptadas:</b> <i>has cataloged / has been cataloging / has catalogued / has been cataloguing</i><br><br><b>Significado y Contraste:</b> Incluye variantes de ortografía británica y americana en aspecto simple y continuo.", tag: "tag-verb" },
        { q: "The urban district ___ [experience] rapid gentrification since the university constructed its new campus.", a: ["has experienced", "has undergone"], h: "Vicula la transformación del barrio a la edificación del campus universitario.", expl: "<b>Formas Aceptadas:</b> <i>has experienced / has undergone</i><br><br><b>Significado y Contraste:</b> Transformación urbana iniciada con la construcción ('since').", tag: "tag-verb" },
        { q: "Volunteers ___ [prepare] emergency relief packages for flood victims for forty-eight continuous hours.", a: ["have prepared", "have been preparing", "have assembled", "have been assembling"], h: "Destaca la intensa labor física desarrollada durante dos días seguidos.", expl: "<b>Formas Aceptadas:</b> <i>have prepared / have been preparing / have assembled / have been assembling</i><br><br><b>Significado y Contraste:</b> Se admiten verbos sinónimos de preparación y ensamblaje con 'for'.", tag: "tag-verb" },
        { q: "Strict data privacy standards ___ [be] enforced across all corporate divisions since Q1.", a: ["have been"], h: "Marca la aplicación continua de normativas desde el primer trimestre.", expl: "<b>Formas Aceptadas:</b> <i>have been</i><br><br><b>Significado y Contraste:</b> Estado pasivo de cumplimiento regulatorio iniciado en 'since Q1'.", tag: "tag-verb" },
        { q: "The clinical trial participants ___ [maintain] daily symptom journals for three full months.", a: ["have maintained", "have been maintaining", "have kept", "have been keeping"], h: "Mide el registro diario de síntomas mantenido durante tres meses.", expl: "<b>Formas Aceptadas:</b> <i>have maintained / have been maintaining / have kept / have been keeping</i><br><br><b>Significado y Contraste:</b> Acepta 'maintain' o 'keep' tanto en simple como en continuo.", tag: "tag-verb" },
        { q: "Interest rates in the eurozone ___ [stay] at historic lows since the central bank intervention.", a: ["have stayed", "have remained"], h: "Muestra la estabilidad del tipo de interés ligada a la intervención central.", expl: "<b>Formas Aceptadas:</b> <i>have stayed / have remained</i><br><br><b>Significado y Contraste:</b> Permanencia de tipos financieros articulada con 'since'.", tag: "tag-verb" },
        { q: "Software engineers ___ [work] to resolve the critical database bug for over twenty-four hours.", a: ["have labored", "have been laboring", "have worked", "have been working", "have tried", "have been trying"], h: "Enfatiza el trabajo técnico continuo llevado a cabo durante un día entero.", expl: "<b>Formas Aceptadas:</b> <i>have worked / have been working / have labored / have been laboring / have tried / have been trying</i><br><br><b>Significado y Contraste:</b> Cobertura de verbos equivalentes de esfuerzo técnico con 'for'.", tag: "tag-verb" },
        { q: "The international space station ___ [support] continuous human habitation since November 2000.", a: ["has supported", "has seen", "has hosted"], h: "Traza la presencia humana ininterrumpida desde noviembre del año 2000.", expl: "<b>Formas Aceptadas:</b> <i>has supported / has hosted / has seen</i><br><br><b>Significado y Contraste:</b> 'Since November 2000' delimita el inicio de la ocupación espacial.", tag: "tag-verb" },
        { q: "The marketing department ___ [track] user engagement metrics across social media platforms for weeks.", a: ["has tracked", "has been tracking"], h: "Mide el rastreo analítico prolongado durante varias semanas seguidas.", expl: "<b>Formas Aceptadas:</b> <i>has tracked / has been tracking</i><br><br><b>Significado y Contraste:</b> Cuantificación de la actividad de métricas mediante la partícula 'for'.", tag: "tag-verb" },
        { q: "A diplomatic stalemate ___ [hinder] progress in the peace negotiations since the summit collapsed.", a: ["has hindered", "has blocked", "has stalled"], h: "Vincular el bloqueo político al momento de la caída de la cumbre de paz.", expl: "<b>Formas Aceptadas:</b> <i>has hindered / has blocked / has stalled</i><br><br><b>Significado y Contraste:</b> Admite sinónimos de estancamiento derivados del punto inicial 'since'.", tag: "tag-verb" },
        { q: "The university language center ___ [offer] intensive English immersion courses for over thirty years.", a: ["has offered", "has been offering"], h: "Mide la oferta de cursos universitarios a lo largo de un período de 30 años.", expl: "<b>Formas Aceptadas:</b> <i>has offered / has been offering</i><br><br><b>Significado y Contraste:</b> Present Perfect acumulativo sustentado en la partícula 'for'.", tag: "tag-verb" }
    ];

    let currentQuizType = 'A';
    let currentData = quizA;
    let idx = 0; 
    let streak = 0; 
    let score = 0; 
    let solvedThisIdx = false;    

    function getBritishFemaleVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return null;

      const preferredFemaleVoices = [
        'Google UK English Female',
        'Microsoft Libby Online (Natural) - English (United Kingdom)',
        'Microsoft Sonia Online (Natural) - English (United Kingdom)',
        'Microsoft Maisie Online (Natural) - English (United Kingdom)',
        'Serena (Premium)', 'Serena (Enhanced)', 'Serena',
        'Kate (Premium)', 'Kate (Enhanced)', 'Kate',
        'Stephanie (Premium)', 'Stephanie (Enhanced)', 'Stephanie',
        'Fiona', 'Martha', 'Microsoft Susan', 'Microsoft Hazel'
      ];

      for (const name of preferredFemaleVoices) {
        const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
        if (found) return found;
      }

      const maleKeywords = ['male', 'george', 'daniel', 'ryan', 'arthur', 'oliver', 'david', 'mark'];
      const enGbFemale = voices.find(v => {
        const lang = (v.lang || '').replace('_', '-').toLowerCase();
        const name = (v.name || '').toLowerCase();
        const isUK = lang === 'en-gb' || name.includes('united kingdom') || name.includes('uk english') || name.includes('british');
        return isUK && !maleKeywords.some(m => name.includes(m));
      });
      if (enGbFemale) return enGbFemale;

      const anyFemaleEnglish = voices.find(v => {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        return lang.startsWith('en') && !maleKeywords.some(m => name.includes(m));
      });
      if (anyFemaleEnglish) return anyFemaleEnglish;

      return voices.find(v => v.name.toLowerCase().includes('female')) || voices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    function speakCurrentSentence() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const card = currentData[idx];
      // Lee diciendo 'blank' en lugar de la respuesta para que funcione como dictado de práctica
      let spokenSentence = card.q.replace(/___+\s*\[\w+\]/, 'blank');
      const utterance = new SpeechSynthesisUtterance(spokenSentence);
      utterance.lang = 'en-GB';
      const voice = getBritishFemaleVoice();
      if (voice) utterance.voice = voice;
      utterance.rate = 0.98;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function openModal() {        
        const tag = currentData[idx].tag;        
        document.getElementById('modalTitle').innerText = rules[tag].title;        
        document.getElementById('modalText').innerHTML = rules[tag].text;        
        document.getElementById('ruleModal').style.display = 'flex';    
    }    

    function closeModal() { 
        document.getElementById('ruleModal').style.display = 'none'; 
    }    

    function update() {        
        if (idx >= currentData.length) {            
            document.getElementById('final-screen').style.display = 'flex';            
            document.getElementById('final-stats').innerText = `Tareas completadas: ${score}/${currentData.length} | Racha: ${streak}`;            
            return;        
        }        
        const card = currentData[idx];        
        document.getElementById('q').innerText = card.q;        
        document.getElementById('a').innerText = "Formas aceptadas: " + card.a.join(" / ");        
        document.getElementById('expl').innerHTML = card.expl;        
        
        let tagName = "PRESENT PERFECT";
        document.getElementById('tagDisplay').innerHTML = `<span class="inline-block px-3.5 py-1 rounded-full text-xs font-bold text-white uppercase tracking-wider bg-blue-600 cursor-pointer shadow-xs">${tagName} (Click para ver regla ℹ️)</span>`;        
        
        document.getElementById('a').classList.remove('block');
        document.getElementById('a').classList.add('hidden');        
        document.getElementById('expl').classList.remove('block');
        document.getElementById('expl').classList.add('hidden');        
        document.getElementById('hintBox').classList.remove('block');
        document.getElementById('hintBox').classList.add('hidden');        
        document.getElementById('feedback').innerText = '';        
        document.getElementById('userInput').value = '';        
        document.getElementById('pg').innerText = `Tarea ${idx + 1} de ${currentData.length}`;        
        solvedThisIdx = false;        
        document.getElementById('pBtn').disabled = idx === 0;    
    }    

    function checkAnswer() {        
        const u = document.getElementById('userInput').value.toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();        
        if(!u) return;        
        const card = currentData[idx];                
        const isCorrect = card.a.some(ans => {            
            const normalizedAns = ans.toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();            
            return u === normalizedAns;        
        });        
        if (isCorrect) {            
            document.getElementById('feedback').innerText = "¡CORRECTO! ✨";            
            document.getElementById('feedback').className = 'h-8 mb-3 font-bold text-sm sm:text-base text-center correct text-emerald-600';            
            document.getElementById('a').classList.remove('hidden');
            document.getElementById('a').classList.add('block');            
            document.getElementById('expl').classList.remove('hidden');
            document.getElementById('expl').classList.add('block');            
            if (!solvedThisIdx) { streak++; score++; solvedThisIdx = true; }        
        } else {            
            document.getElementById('feedback').innerText = "INTÉNTALO DE NUEVO ❌";            
            document.getElementById('feedback').className = 'h-8 mb-3 font-bold text-sm sm:text-base text-center wrong text-rose-500';            
            streak = 0;        
        }        
        document.getElementById('streak-count').innerText = streak;        
        document.getElementById('score-display').innerText = score;    
    }    

    function showHint() {
        document.getElementById('hintBox').innerText = "💡 " + currentData[idx].h;        
        document.getElementById('hintBox').classList.remove('hidden');
        document.getElementById('hintBox').classList.add('block');     
    }        

    function revealAnswer() {         
        document.getElementById('a').classList.remove('hidden');
        document.getElementById('a').classList.add('block');         
        document.getElementById('expl').classList.remove('hidden');
        document.getElementById('expl').classList.add('block');        
        streak = 0; 
        document.getElementById('streak-count').innerText = streak;    
    }    

    function next() {         
        if (idx < currentData.length - 1) {             
            idx++;             
            update();         
        } else {             
            idx++;             
            update();         
        }     
    }        

    function prev() { 
        if (idx > 0) { 
            idx--; 
            update(); 
        } 
    }    

    function switchQuiz(type) {
        currentQuizType = type;
        currentData = (type === 'A') ? quizA : quizB;
        idx = 0;
        score = 0;
        streak = 0;
        solvedThisIdx = false;

        document.getElementById("tabA").className = (type === 'A') ? "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer" : "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition cursor-pointer";
        document.getElementById("tabB").className = (type === 'B') ? "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer" : "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition cursor-pointer";
        document.getElementById("subTitle").innerText = `Essential Present Perfect Practice (Quiz ${type})`;
        
        document.getElementById('final-screen').style.display = 'none';
        update();
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') checkAnswer(); 
    });    

    document.getElementById('btn-audio').onclick = speakCurrentSentence;
    document.getElementById('btn-reset').onclick = () => {
      if (confirm('¿Reiniciar desde la tarea 1 y poner el contador a cero?')) {
        score = 0;
        streak = 0;
        solvedThisIdx = false;
        idx = 0;
        update();
      }
    };

    update();
</script>
</body>
