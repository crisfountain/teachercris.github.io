const quizA = rawDataset.slice(0, 22);
const quizB = rawDataset.slice(22, 45);

let currentMode = 'A';
let currentIndex = 0;
let score = 0;
let streak = 0;
let solvedThisIdx = false;

function getCurrentDataset() {
  return currentMode === 'A' ? quizA : quizB;
}

function getBritishFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;

  const preferredFemaleVoices = [
    'Google UK English Female',
    'Microsoft Libby Online (Natural) - English (United Kingdom)',
    'Microsoft Sonia Online (Natural) - English (United Kingdom)',
    'Microsoft Maisie Online (Natural) - English (United Kingdom)',
    'Serena (Premium)', 'Serena (Enhanced)', 'Serena',
    'Kate (Premium)', 'Kate (Enhanced)', 'Kate',
    'Stephanie (Premium)', 'Stephanie (Enhanced)', 'Stephanie',
    'Fiona', 'Martha', 'Microsoft Susan', 'Microsoft Hazel'
  ];

  for (const name of preferredFemaleVoices) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return found;
  }

  const maleKeywords = ['male', 'george', 'daniel', 'ryan', 'arthur', 'oliver', 'david', 'mark'];
  const enGbFemale = voices.find(v => {
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    const name = (v.name || '').toLowerCase();
    const isUK = lang === 'en-gb' || name.includes('united kingdom') || name.includes('uk english') || name.includes('british');
    return isUK && !maleKeywords.some(m => name.includes(m));
  });
  if (enGbFemale) return enGbFemale;

  const anyGb = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase() === 'en-gb');
  if (anyGb) return anyGb;

  const anyFemaleEnglish = voices.find(v => {
    const name = (v.name || '').toLowerCase();
    const lang = (v.lang || '').toLowerCase();
    return lang.startsWith('en') && !maleKeywords.some(m => name.includes(m));
  });
  if (anyFemaleEnglish) return anyFemaleEnglish;

  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

function speakBritish() {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const dataset = getCurrentDataset();
  const current = dataset[currentIndex];
  
  let spokenSentence = current.q.replace(/____+\s*\[\w+\]/, 'blank');
  
  const utterance = new SpeechSynthesisUtterance(spokenSentence);
  utterance.lang = 'en-GB';
  utterance.rate = 0.98;
  utterance.pitch = 1.05;
  const voice = getBritishFemaleVoice();
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}

function switchQuizMode(mode) {
  currentMode = mode;
  currentIndex = 0;
  score = 0;
  streak = 0;
  solvedThisIdx = false;
  const tabA = document.getElementById('tab-quiz-a');
  const tabB = document.getElementById('tab-quiz-b');
  const sub = document.getElementById('subtitulo-quiz');

  if (mode === 'A') {
    tabA.className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer';
    tabB.className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition cursor-pointer';
    sub.innerText = 'Essential Gerunds vs Infinitives Practice (QUIZ A)';
  } else {
    tabB.className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer';
    tabA.className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition cursor-pointer';
    sub.innerText = 'Essential Gerunds vs Infinitives Practice (QUIZ B)';
  }
  loadChallenge();
}

function loadChallenge() {
  const dataset = getCurrentDataset();
  if (currentIndex >= dataset.length) {
    showFinalSummary();
    return;
  }
  solvedThisIdx = false;
  const current = dataset[currentIndex];

  document.getElementById('progreso-texto').innerText = `Tarea ${currentIndex + 1} de ${dataset.length}`;
  document.getElementById('puntuacion').innerText = score;
  document.getElementById('streak-badge').innerText = streak;

  document.getElementById('category-pill-text').innerText = (current.category || 'Standard').toUpperCase();
  document.getElementById('pregunta-texto').innerText = current.q;

  document.getElementById('hintBox').classList.add('hidden');
  document.getElementById('a').classList.add('hidden');
  document.getElementById('expl').classList.add('hidden');
  document.getElementById('feedback').innerText = '';
  document.getElementById('userInput').value = '';

  document.getElementById('btn-anterior').disabled = (currentIndex === 0);
}

function checkAnswer() {
  const u = document.getElementById('userInput').value.toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();
  if(!u) return;
  const dataset = getCurrentDataset();
  const current = dataset[currentIndex];
  
  const correctAns = current.options[0].toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();
  const isCorrect = (u === correctAns);

  if (isCorrect) {
    document.getElementById('feedback').innerText = "¡CORRECTO! ✨";
    document.getElementById('feedback').className = 'h-8 mb-3 font-bold text-sm sm:text-base text-center text-emerald-600';
    document.getElementById('a').innerText = "Formas aceptadas: " + current.options[0];
    document.getElementById('a').classList.remove('hidden');
    document.getElementById('a').classList.add('block');
    document.getElementById('expl').innerHTML = `<strong>Explicación:</strong><br>${current.expl}<br><br><b>Regla Clave:</b> ${current.alert}`;
    document.getElementById('expl').classList.remove('hidden');
    document.getElementById('expl').classList.add('block');
    if (!solvedThisIdx) { streak++; score++; solvedThisIdx = true; }
  } else {
    document.getElementById('feedback').innerText = "INTÉNTALO DE NUEVO ❌";
    document.getElementById('feedback').className = 'h-8 mb-3 font-bold text-sm sm:text-base text-center text-rose-500';
    streak = 0;
  }
  document.getElementById('streak-badge').innerText = streak;
  document.getElementById('puntuacion').innerText = score;
}

function showHint() {
  const current = getCurrentDataset()[currentIndex];
  document.getElementById('hintBox').innerText = "💡 " + current.h;
  document.getElementById('hintBox').classList.remove('hidden');
  document.getElementById('hintBox').classList.add('block');
}

function revealAnswer() {
  const current = getCurrentDataset()[currentIndex];
  document.getElementById('a').innerText = "Respuesta: " + current.options[0];
  document.getElementById('a').classList.remove('hidden');
  document.getElementById('a').classList.add('block');
  document.getElementById('expl').innerHTML = `<strong>Explicación:</strong><br>${current.expl}<br><br><b>Regla Clave:</b> ${current.alert}`;
  document.getElementById('expl').classList.remove('hidden');
  document.getElementById('expl').classList.add('block');
  streak = 0;
  document.getElementById('streak-badge').innerText = streak;
}

function next() {
  currentIndex++;
  loadChallenge();
}

function prev() {
  if (currentIndex > 0) {
    currentIndex--;
    loadChallenge();
  }
}

document.getElementById('btn-categoria').onclick = showHint;
document.getElementById('btn-audio-sentence').onclick = speakBritish;

document.getElementById('userInput').addEventListener('keypress', (e) => { 
  if (e.key === 'Enter') checkAnswer(); 
});

function showFinalSummary() {
  const dataset = getCurrentDataset();
  const card = document.getElementById('quiz-card');
  card.innerHTML = `
    <div class="text-center py-8">
      <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl font-bold shadow-inner">🏆</div>
      <h2 class="text-3xl font-extrabold text-slate-900 mb-2">¡Sesión Completada!</h2>
      <p class="text-slate-600 mb-6 max-w-md mx-auto">Has completado con éxito este módulo de práctica.</p>
      <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 mb-6 max-w-sm mx-auto shadow-xs">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Puntuación Final</span>
        <div class="text-5xl font-black text-blue-600 tracking-tight my-1">${score} <span class="text-2xl text-slate-400 font-semibold">/ ${dataset.length}</span></div>
      </div>
      <button onclick="location.reload()" class="w-full max-w-sm mx-auto bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg cursor-pointer">Reiniciar Práctica</button>
    </div>
  `;
}

loadChallenge();
