// Audio Synth
let audioCtx = null;
function playSound(type) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'correct') {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sine'; osc1.frequency.setValueAtTime(523.25, now); osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
      osc2.type = 'triangle'; osc2.frequency.setValueAtTime(659.25, now + 0.08); osc2.frequency.exponentialRampToValueAtTime(783.99, now + 0.22);
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.18, now + 0.05); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
      osc1.start(now); osc2.start(now + 0.08); osc1.stop(now + 0.35); osc2.stop(now + 0.35);
    } else if (type === 'incorrect') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(260, now); osc.frequency.setValueAtTime(220, now + 0.12);
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.16, now + 0.03); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.28);
    }
  } catch(e) {}
}

function getBritishFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  const preferredFemaleVoices = [
    'Google UK English Female',
    'Microsoft Libby Online (Natural) - English (United Kingdom)',
    'Microsoft Sonia Online (Natural) - English (United Kingdom)',
    'Microsoft Maisie Online (Natural) - English (United Kingdom)',
    'Serena (Premium)', 'Serena (Enhanced)', 'Serena',
    'Kate (Premium)', 'Kate (Enhanced)', 'Kate',
    'Stephanie (Premium)', 'Stephanie (Enhanced)', 'Stephanie',
    'Fiona', 'Martha', 'Microsoft Susan', 'Microsoft Hazel'
  ];
  for (const name of preferredFemaleVoices) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return found;
  }
  const maleKeywords = ['male', 'george', 'daniel', 'ryan', 'arthur', 'oliver', 'david', 'mark'];
  const enGbFemale = voices.find(v => {
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    const name = (v.name || '').toLowerCase();
    const isUK = lang === 'en-gb' || name.includes('united kingdom') || name.includes('uk english') || name.includes('british');
    return isUK && !maleKeywords.some(m => name.includes(m));
  });
  if (enGbFemale) return enGbFemale;
  const anyGb = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase() === 'en-gb');
  if (anyGb) return anyGb;
  const anyFemaleEnglish = voices.find(v => {
    const name = (v.name || '').toLowerCase();
    const lang = (v.lang || '').toLowerCase();
    return lang.startsWith('en') && !maleKeywords.some(m => name.includes(m));
  });
  if (anyFemaleEnglish) return anyFemaleEnglish;
  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

function speakCurrentSentence() {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const currentList = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  const sentence = currentList[localIndex].q.replace(/____+\s*\[\w+\]/, 'blank');
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'en-GB';
  const voice = getBritishFemaleVoice();
  if (voice) {
    utterance.voice = voice;
  }
  utterance.rate = 0.98;
  utterance.pitch = 1.05;
  window.speechSynthesis.speak(utterance);
}

function getCurrentChallenge() {
  const list = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  return list[localIndex];
}

function renderTask() {
  const currentList = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  const current = currentList[localIndex];
  isAnswerVerified = false;

  // Header & Counts
  document.getElementById('task-counter').innerText = `Tarea ${localIndex + 1} de ${currentList.length}`;
  document.getElementById('score-display').innerText = score;
  document.getElementById('streak-display').innerText = streak;
  document.getElementById('quiz-subtitle').innerText = `Essential Present Perfect vs Past Simple Practice (${currentQuizMode === 'A' ? 'Quiz A' : 'Quiz B'})`;

  // Aspect Category Pill
  const aspect = current.targetAspect || 'PRESENT PERFECT';
  document.getElementById('category-pill-text').innerText = aspect;

  // Question & Hint
  document.getElementById('pregunta-texto').innerText = current.q;
  document.getElementById('pista-texto').innerText = current.h;
  document.getElementById('pista-box').classList.add('hidden');

  // Input & Feedback Box & Verify Button
  document.getElementById('userInput').value = '';
  document.getElementById('userInput').disabled = false;
  document.getElementById('feedback-box').classList.add('hidden');
  const btnVerify = document.getElementById('btn-verify');
  btnVerify.innerText = 'Verificar (Enter)';
  btnVerify.disabled = false;

  // Prev button state (mantiene el color azul corporativo sólido sin opacidad reducida)
  const btnPrev = document.getElementById('btn-prev');
  if (localIndex === 0) {
    btnPrev.disabled = true;
    btnPrev.style.cursor = 'not-allowed';
  } else {
    btnPrev.disabled = false;
    btnPrev.style.cursor = 'pointer';
  }
}

function verifyAnswer() {
  const inputVal = document.getElementById('userInput').value.trim().toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ');
  if (!inputVal) return;
  
  if (isAnswerVerified) {
    nextTask();
    return;
  }
  isAnswerVerified = true;
  const current = getCurrentChallenge();
  
  // Clean standard options for comparison
  const correctOption = current.options[current.correct].trim().toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ');
  const isCorrect = (inputVal === correctOption);

  document.getElementById('userInput').disabled = true;

  if (isCorrect) {
    playSound('correct');
    if (!solvedTasks[current.id]) {
      score++;
      solvedTasks[current.id] = true;
      document.getElementById('score-display').innerText = score;
    }
    streak++;
    document.getElementById('streak-display').innerText = streak;
  } else {
    playSound('incorrect');
    streak = 0;
    document.getElementById('streak-display').innerText = streak;
  }

  // Feedback Box
  const feedbackBox = document.getElementById('feedback-box');
  const feedbackTitulo = document.getElementById('feedback-titulo');
  const feedbackTarget = document.getElementById('feedback-target-badge');
  const feedbackExplicacion = document.getElementById('feedback-explicacion');
  const feedbackAlert = document.getElementById('feedback-alert');
  const feedbackChunk = document.getElementById('feedback-chunk');

  if (isCorrect) {
    feedbackBox.className = 'p-5 rounded-2xl mb-5 border bg-emerald-50/90 border-emerald-200 block transition-all';
    feedbackTitulo.innerText = '¡Excelente!';
    feedbackTitulo.className = 'font-bold text-base sm:text-lg text-emerald-800';
    feedbackTarget.classList.add('hidden');
  } else {
    feedbackBox.className = 'p-5 rounded-2xl mb-5 border bg-rose-50/90 border-rose-200 block transition-all';
    feedbackTitulo.innerText = '¡Distinción Clave / Toma Nota!';
    feedbackTitulo.className = 'font-bold text-base sm:text-lg text-rose-800';
    feedbackTarget.innerText = `Correcto: ${current.options[current.correct]}`;
    feedbackTarget.classList.remove('hidden');
  }

  feedbackExplicacion.innerText = current.expl;
  feedbackAlert.innerText = current.alert;
  feedbackChunk.innerText = `Bloque: ${current.chunk}`;

  // Update button to Next
  const btnVerify = document.getElementById('btn-verify');
  btnVerify.innerText = 'Siguiente Reto → (Enter)';
  btnVerify.disabled = false;
}

function nextTask() {
  const currentList = currentQuizMode === 'A' ? QUIZ_A : QUIZ_B;
  if (localIndex < currentList.length - 1) {
    localIndex++;
    renderTask();
  } else {
    if (currentQuizMode === 'A') {
      if (confirm('¡Quiz A completado! ¿Quieres pasar al Quiz B (Tareas 23-45)?')) {
        switchQuiz('B');
      }
    } else {
      alert(`¡Enhorabuena! Has completado las 45 tareas. Puntuación final: ${score} / 45.`);
    }
  }
}

function prevTask() {
  if (localIndex > 0) {
    localIndex--;
    renderTask();
  }
}

function switchQuiz(mode) {
  currentQuizMode = mode;
  localIndex = 0;
  if (mode === 'A') {
    document.getElementById('tab-quiz-a').className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer';

  } else {
    document.getElementById('tab-quiz-b').className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer';
    document.getElementById('tab-quiz-a').className = 'py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition cursor-pointer';
  }
  renderTask();
}

function showAnswer() {
  const current = getCurrentChallenge();
  document.getElementById('userInput').value = current.options[current.correct];
  verifyAnswer();
  streak = 0;
  document.getElementById('streak-display').innerText = streak;
}

// Event Listeners
document.getElementById('btn-verify').onclick = verifyAnswer;
document.getElementById('btn-next').onclick = nextTask;
document.getElementById('btn-prev').onclick = prevTask;
document.getElementById('btn-hint').onclick = () => {
  document.getElementById('pista-box').classList.toggle('hidden');
};
document.getElementById('btn-show-answer').onclick = showAnswer;
document.getElementById('tab-quiz-a').onclick = () => switchQuiz('A');
document.getElementById('tab-quiz-b').onclick = () => switchQuiz('B');
document.getElementById('btn-audio').onclick = speakCurrentSentence;
document.getElementById('btn-reset').onclick = () => {
  if (confirm('¿Reiniciar desde la Tarea 1 y poner la puntuación a cero?')) {
    score = 0;
    streak = 0;
    solvedTasks = {};
    localIndex = 0;
    renderTask();
  }
};

// Keyboard listener
document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    if (isAnswerVerified) {
      nextTask();
    } else {
      verifyAnswer();
    }
  }
});

// Category Modal handlers
const modal = document.getElementById('modal-category');
document.getElementById('btn-category').onclick = () => {
  const current = getCurrentChallenge();
  const aspect = current.targetAspect || 'PRESENT PERFECT';
  document.getElementById('modal-aspect-badge').innerText = aspect;
  const content = document.getElementById('modal-content');

  if (aspect === 'PRESENT PERFECT') {
    content.innerHTML = `
      <div>
        <h3 class="font-bold text-slate-900 text-base mb-1">Present Perfect (have / has + participio pasado)</h3>
        <p class="text-xs text-slate-600 leading-relaxed">Se usa cuando una acción ocurrió en el pasado pero tiene una <strong>conexión directa con el momento presente</strong>, experiencia vital acumulada o un marco temporal inacabado.</p>
      </div>
      <div class="bg-blue-50/60 p-4 rounded-2xl border border-blue-100 space-y-2 text-xs">
        <p class="font-bold text-blue-950 uppercase tracking-wider text-[11px]">Gatillos Gramaticales Clave:</p>
        <p class="text-slate-700">• <strong>Tiempo Inacabado:</strong> <em>this week, this year, so far today</em></p>
        <p class="text-slate-700">• <strong>Experiencia Vital:</strong> <em>ever, never, in my life, three times</em></p>
        <p class="text-slate-700">• <strong>Resultado Presente:</strong> <em>"I have lost my passport!" (falta ahora mismo)</em></p>
        <p class="text-slate-700">• <strong>Pasado Inmediato:</strong> <em>have just finished, recently</em></p>
        <p class="text-slate-700">• <strong>Punto de Partida / Duración:</strong> <em>since Monday, for ten years (en curso)</em></p>
      </div>
      <div class="bg-amber-50/70 p-3.5 rounded-2xl border border-amber-200 text-xs text-amber-950">
        <p class="font-bold mb-1">💡 Regla Clave:</p>
        <p class="leading-relaxed">¡Nunca uses el Present Perfect con marcadores de tiempo pasado cerrados como <em>yesterday</em>, <em>last week</em> o <em>ago</em>!</p>
      </div>
    `;
  } else {
    content.innerHTML = `
      <div>
        <h3 class="font-bold text-slate-900 text-base mb-1">Past Simple (V2 / did + forma base)</h3>
        <p class="text-xs text-slate-600 leading-relaxed">Se usa para acciones completadas en un <strong>periodo de tiempo cerrado y finalizado</strong>. La conexión con el presente se corta por completo.</p>
      </div>
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
        <p class="font-bold text-slate-900 uppercase tracking-wider text-[11px]">Marcadores Estrictos de Past Simple:</p>
        <p class="text-slate-700">• <strong>Marcadores Pasados Explícitos:</strong> <em>yesterday, last month, last autumn</em></p>
        <p class="text-slate-700">• <strong>La Regla de "-ago":</strong> <em>two days ago, ten minutes ago</em></p>
        <p class="text-slate-700">• <strong>Fechas/Años Específicos:</strong> <em>in 2019, in 1845, at 5:00 AM yesterday</em></p>
        <p class="text-slate-700">• <strong>Etapa Vital Completada:</strong> <em>when I was a student, during his lifetime</em></p>
      </div>
      <div class="bg-blue-50/60 p-3.5 rounded-2xl border border-blue-100 text-xs text-blue-900">
        <p class="font-bold mb-1">Fórmula de Estructura:</p>
        <p class="font-mono text-slate-700">Sujeto + Verbo en pasado (ed / irregular 2ª forma como discovered, went, held, struck)</p>
      </div>
    `;
  }
  modal.classList.remove('hidden');
};

document.getElementById('btn-close-modal').onclick = () => modal.classList.add('hidden');
document.getElementById('btn-modal-return').onclick = () => modal.classList.add('hidden');
modal.onclick = (e) => { if (e.target === modal) modal.classList.add('hidden'); };

// Initial Load
renderTask();
</script>

</body>
</html>
