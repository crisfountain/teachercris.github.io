    <button id="pBtn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-xl text-sm sm:text-base flex items-center justify-center gap-1.5 transition shadow-xs cursor-pointer" onclick="prev()">&larr; Previous</button>

</div>

<script>
const rules = {
  "tag-verb": { 
    title: "Present Perfect Aspect", 
    text: "Verbs using the Present Perfect Simple or Present Perfect Continuous to connect past actions or states to the present moment.<br><br>• <b>For + Duration:</b> Measures a period of time up to now (e.g., <i>has worked for twelve years</i>).<br>• <b>Since + Starting Point:</b> Anchors an ongoing state to a specific point in time (e.g., <i>has been since 2020</i>)." 
  }
};

const quizA = [
  { q: "Dr. Aris ___ at the research institute for over twelve years, leading groundbreaking work on genomic sequencing.", a: ["has worked", "has been working"], h: "Visualize an action that originated in the past and continues seamlessly into the present moment over a measured duration.", expl: "<b>Grammar & Structure:</b> has worked for / has been working for<br><br><b>Temporal Anchor & Aspect:</b> English uses the present perfect (simple or continuous) with <b>for</b> to connect a past starting point to the present moment across a measured duration of time.", tag: "tag-verb" },
  { q: "The international trade alliance ___ in effect since January 2020, boosting bilateral exports across Europe.", a: ["has been"], h: "Anchor an ongoing state back to a specific starting point in time rather than a measured duration.", expl: "<b>Grammar & Structure:</b> has been since<br><br><b>Temporal Anchor & Aspect:</b> The temporal preposition <b>since</b> marks a specific historical starting point ('January 2020'), requiring the present perfect to express an ongoing state extending up to the present.", tag: "tag-verb" },
  { q: "Our senior engineering team ___ on this aerospace project for six consecutive months without a single day off.", a: ["has worked", "has been working", "have worked", "have been working"], h: "Focus on continuous activity extending over an accumulated period of time.", expl: "<b>Grammar & Structure:</b> has been working for / have been working for<br><br><b>Temporal Anchor & Aspect:</b> The present perfect continuous with <b>for</b> emphasizes ongoing, continuous activity extending over an accumulated time period ('six consecutive months').", tag: "tag-verb" },
  { q: "The chief executive officer ___ in charge of corporate communications since the restructuring took place.", a: ["has been"], h: "Connect a continuous leadership role directly to a specific past event serving as the starting mark.", expl: "<b>Grammar & Structure:</b> has been since<br><br><b>Temporal Anchor & Aspect:</b> When <b>since</b> introduces a past clause or event ('the restructuring took place'), the main clause must use the present perfect to connect that past event to the present role.", tag: "tag-verb" },
  { q: "Global stock markets ___ remarkable volatility for the past three fiscal quarters.", a: ["have experienced", "have been experiencing"], h: "Measure the duration of market fluctuations stretching over a defined block of time up to the present.", expl: "<b>Grammar & Structure:</b> have experienced for / have been experiencing for<br><br><b>Temporal Anchor & Aspect:</b> Timeframes like 'the past three fiscal quarters' represent a period of duration up to the present, requiring <b>for</b> paired with the present perfect aspect.", tag: "tag-verb" },
  { q: "Professor Harrison ___ economic policy at Oxford University since he published his seminal treatise in 2015.", a: ["has taught", "has been teaching"], h: "Trace an academic tenure from a specific landmark year of publication up to the current academic term.", expl: "<b>Grammar & Structure:</b> has taught since / has been teaching since<br><br><b>Temporal Anchor & Aspect:</b> The conjunction <b>since</b> establishes a specific past time anchor ('since he published...'), requiring the present perfect in the main clause for actions that continue to the present.", tag: "tag-verb" },
  { q: "The pharmaceutical board ___ the clinical trial data for two weeks, but no official verdict has been released.", a: ["has reviewed", "has been reviewing", "have reviewed", "have been reviewing"], h: "Emphasize an ongoing investigative activity taking place across a multi-day span.", expl: "<b>Grammar & Structure:</b> has been reviewing for / have been reviewing for<br><br><b>Temporal Anchor & Aspect:</b> Quantifying an ongoing activity over a continuous time period ('for two weeks') requires the present perfect aspect combined with <b>for</b>.", tag: "tag-verb" },
  { q: "Ever since the regulatory reforms were enacted, compliance officers ___ strict oversight across all branches.", a: ["have maintained", "have been maintaining"], h: "Link continuous oversight to the exact historical moment the new regulations were passed.", expl: "<b>Grammar & Structure:</b> have maintained since / have been maintaining since<br><br><b>Temporal Anchor & Aspect:</b> The emphatic marker <b>ever since</b> reinforces unbroken continuity from a past event ('reforms were enacted') to the present moment, requiring the present perfect.", tag: "tag-verb" },
  { q: "The historic hotel ___ owned by the same founding family for more than a century.", a: ["has been"], h: "Express an uninterrupted state of ownership covering an extensive period of one hundred years.", expl: "<b>Grammar & Structure:</b> has been owned for<br><br><b>Temporal Anchor & Aspect:</b> State verbs in passive constructions (such as <i>has been owned</i>) pair with <b>for</b> to express an uninterrupted condition spanning a specific duration ('more than a century').", tag: "tag-verb" },
  { q: "Renewable energy investments ___ rapidly across Scandinavian nations since the dawn of the decade.", a: ["have grown", "have been growing"], h: "Track the growth curve of energy investments starting from a fixed calendar milestone.", expl: "<b>Grammar & Structure:</b> have grown since / have been growing since<br><br><b>Temporal Anchor & Aspect:</b> The phrase 'since the dawn of the decade' marks a specific starting point in time, requiring the present perfect to indicate ongoing growth or progress up to now.", tag: "tag-verb" },
  { q: "The software development firm ___ its core server infrastructure for nearly five hours.", a: ["has been upgrading", "has upgraded"], h: "Represent an ongoing technical maintenance process measured across a five-hour span.", expl: "<b>Grammar & Structure:</b> has been upgrading for / has upgraded for<br><br><b>Temporal Anchor & Aspect:</b> Measuring an ongoing active process across a specific timeframe ('nearly five hours') requires the present perfect continuous paired with <b>for</b>.", tag: "tag-verb" },
  { q: "Public interest in autonomous transportation ___ significantly since the international motor show.", a: ["has increased", "has been increasing"], h: "Identify a shift in public attention that began at a specific promotional event.", expl: "<b>Grammar & Structure:</b> has increased since / has been increasing since<br><br><b>Temporal Anchor & Aspect:</b> The event 'the international motor show' serves as a fixed starting point marked by <b>since</b>, necessitating the present perfect in the main clause.", tag: "tag-verb" },
  { q: "The lead archeologist ___ artifact excavations in the Valley of the Kings for three consecutive seasons.", a: ["has directed", "has been directing"], h: "Describe professional leadership extending across multiple archaeological seasons.", expl: "<b>Grammar & Structure:</b> has directed for / has been directing for<br><br><b>Temporal Anchor & Aspect:</b> Expressing ongoing active leadership or work over an accumulated duration ('three consecutive seasons') demands the present perfect continuous with <b>for</b>.", tag: "tag-verb" },
  { q: "Substantial funding for urban reforestation ___ available since the green initiative was approved.", a: ["has been"], h: "Indicate continuous financial availability triggered by a legislative milestone.", expl: "<b>Grammar & Structure:</b> has been since<br><br><b>Temporal Anchor & Aspect:</b> The clause 'since the green initiative was approved' anchors the origin of a state in the past, requiring <i>has been</i> to state ongoing availability.", tag: "tag-verb" },
  { q: "The diplomatic envoys ___ peaceful resolution strategies for four grueling weeks.", a: ["have negotiated", "have been negotiating"], h: "Highlight the extended duration of diplomatic talks reaching up to the current session.", expl: "<b>Grammar & Structure:</b> have negotiated for / have been negotiating for<br><br><b>Temporal Anchor & Aspect:</b> When quantifying the length of an ongoing effort ('for four grueling weeks'), English uses the present perfect aspect to connect the past duration to the present.", tag: "tag-verb" },
  { q: "Dr. Vance ___ a column on behavioral economics for the Sunday Times since last summer.", a: ["has written", "has been writing"], h: "Reference a recurring journalism activity that began in a specific previous season.", expl: "<b>Grammar & Structure:</b> has written since / has been writing since<br><br><b>Temporal Anchor & Aspect:</b> The temporal marker <b>since</b> introduces the starting time ('last summer'), requiring the present perfect to describe a recurring or continuous activity up to now.", tag: "tag-verb" },
  { q: "The environmental agency ___ atmospheric carbon levels in the region for twenty-five years.", a: ["has monitored", "has been monitoring"], h: "Focus on a long-term scientific tracking process evaluated over a quarter-century block.", expl: "<b>Grammar & Structure:</b> has monitored for / has been monitoring for<br><br><b>Temporal Anchor & Aspect:</b> Long-term scientific processes measured over a specific duration ('twenty-five years') require <b>for</b> combined with the present perfect simple or continuous.", tag: "tag-verb" },
  { q: "Automotive battery technology ___ unprecedented advancements since the breakthrough in solid-state cells.", a: ["has seen", "has undergone", "has experienced"], h: "Connect technological progress directly to a specific scientific discovery that triggered it.", expl: "<b>Grammar & Structure:</b> has seen since / has undergone since<br><br><b>Temporal Anchor & Aspect:</b> <b>Since</b> introduces the landmark event ('the breakthrough...'), requiring the main clause verb to take the present perfect aspect to reflect ongoing results.", tag: "tag-verb" },
  { q: "The regional hospital system ___ with severe staffing shortages for several months.", a: ["has struggled", "has been struggling"], h: "Describe an ongoing operational difficulty measured across several recent months.", expl: "<b>Grammar & Structure:</b> has struggled for / has been struggling for<br><br><b>Temporal Anchor & Aspect:</b> Describing ongoing difficulties over an extended duration ('several months') calls for <b>for</b> paired with the present perfect simple or continuous.", tag: "tag-verb" },
  { q: "Our company headquarters ___ located in Frankfurt since the corporate merger in 2012.", a: ["have been", "has been"], h: "Point to the static geographic location established at a fixed calendar date.", expl: "<b>Grammar & Structure:</b> has been located since / have been located since<br><br><b>Temporal Anchor & Aspect:</b> Static state verbs (e.g., <i>be located</i>) use the present perfect simple with <b>since</b> when referencing a fixed starting point in time ('2012').", tag: "tag-verb" },
  { q: "The investigative journalist ___ the offshore banking network for nearly a year.", a: ["has investigated", "has been investigating"], h: "Measure the duration of an active media investigation stretching close to twelve months.", expl: "<b>Grammar & Structure:</b> has investigated for / has been investigating for<br><br><b>Temporal Anchor & Aspect:</b> Active investigations measured over a duration of time ('nearly a year') require the present perfect paired with <b>for</b> to express ongoing action up to the present.", tag: "tag-verb" },
  { q: "Heavy snowstorms ___ travel across the alpine passes since early yesterday morning.", a: ["have disrupted", "have been disrupting"], h: "Link weather disruption to a specific timestamp in the recent past.", expl: "<b>Grammar & Structure:</b> have disrupted since / have been disrupting since<br><br><b>Temporal Anchor & Aspect:</b> A specific starting timestamp in the recent past ('early yesterday morning') marked by <b>since</b> dictates the use of the present perfect aspect.", tag: "tag-verb" }
];

const quizB = [
  { q: "The non-profit foundation ___ food relief to refugee camps for over half a decade.", a: ["has provided", "has been providing"], h: "Quantify humanitarian relief efforts over a five-year period up to the present.", expl: "<b>Grammar & Structure:</b> has provided for / has been providing for<br><br><b>Temporal Anchor & Aspect:</b> Measuring continuous support or action across a multi-year duration ('for over half a decade') requires the present perfect aspect combined with <b>for</b>.", tag: "tag-verb" },
  { q: "Tensions between the negotiating factions ___ noticeably since the press conference concluded.", a: ["have eased", "have been easing"], h: "Show a gradual improvement in relations starting immediately after a specific event.", expl: "<b>Grammar & Structure:</b> have eased since / have been easing since<br><br><b>Temporal Anchor & Aspect:</b> The conclusion of a specific event ('the press conference concluded') forms the <b>since</b> temporal anchor, requiring the present perfect for ongoing changes.", tag: "tag-verb" },
  { q: "The legal department ___ the contract draft for three business days without reaching a conclusion.", a: ["has scrutinized", "has been scrutinizing", "have scrutinized", "have been scrutinizing"], h: "Measure detailed legal analysis across a three-day work window.", expl: "<b>Grammar & Structure:</b> has scrutinized for / has been scrutinizing for<br><br><b>Temporal Anchor & Aspect:</b> Continuous intensive work spanning a specific duration ('three business days') requires <b>for</b> with the present perfect aspect.", tag: "tag-verb" },
  { q: "The museum's rare manuscript collection ___ on public display since the ceremonial opening.", a: ["has been"], h: "State the ongoing public exhibition of artifacts since a formal ceremony.", expl: "<b>Grammar & Structure:</b> has been on display since<br><br><b>Temporal Anchor & Aspect:</b> An ongoing state linked back to a formal past event ('the ceremonial opening') by <b>since</b> requires the present perfect form <i>has been</i>.", tag: "tag-verb" },
  { q: "Financial analysts ___ the potential economic fallout of the new policy for weeks.", a: ["have debated", "have been debating"], h: "Highlight continuous professional debate taking place across multiple weeks.", expl: "<b>Grammar & Structure:</b> have debated for / have been debating for<br><br><b>Temporal Anchor & Aspect:</b> Ongoing discussions or debates taking place over an extended timeframe ('for weeks') are expressed using the present perfect aspect with <b>for</b>.", tag: "tag-verb" },
  { q: "Cybersecurity defense systems ___ automatically updated every hour since the malware threat emerged.", a: ["have been"], h: "Refer to repeated automated updates instituted when a specific threat first appeared.", expl: "<b>Grammar & Structure:</b> have been updated since<br><br><b>Temporal Anchor & Aspect:</b> In passive constructions, <b>since</b> marks the initial appearance of an event ('the malware threat emerged'), governing the present perfect passive <i>have been updated</i>.", tag: "tag-verb" },
  { q: "The theatrical production company ___ rehearsals for the broadway revival for two months.", a: ["has conducted", "has been conducting"], h: "Quantify active artistic rehearsals spanning a sixty-day timeframe.", expl: "<b>Grammar & Structure:</b> has conducted for / has been conducting for<br><br><b>Temporal Anchor & Aspect:</b> Active ongoing activities measured across a specific time block ('two months') require the present perfect continuous paired with <b>for</b>.", tag: "tag-verb" },
  { q: "Architectural plans for the new transport hub ___ under official review since last November.", a: ["have been"], h: "Indicate an ongoing administrative state originating in a specific past month.", expl: "<b>Grammar & Structure:</b> have been under review since<br><br><b>Temporal Anchor & Aspect:</b> An ongoing administrative state whose inception is dated by <b>since</b> ('last November') requires the present perfect simple <i>have been</i>.", tag: "tag-verb" },
  { q: "The research team ___ sample data from deep-sea trenches for several weeks.", a: ["has collected", "has been collecting"], h: "Measure scientific data gathering conducted across a multi-week expedition.", expl: "<b>Grammar & Structure:</b> has collected for / has been collecting for<br><br><b>Temporal Anchor & Aspect:</b> Data gathering or ongoing scientific tasks measured across a duration of time ('several weeks') take <b>for</b> with the present perfect.", tag: "tag-verb" },
  { q: "Consumer confidence in the banking sector ___ steady since the government guarantee was announced.", a: ["has remained"], h: "Show a sustained level of confidence starting at the official government announcement.", expl: "<b>Grammar & Structure:</b> has remained steady since<br><br><b>Temporal Anchor & Aspect:</b> Linking ongoing stability to a specific historical event ('the government guarantee was announced') requires <i>has remained</i> governed by <b>since</b>.", tag: "tag-verb" },
  { q: "The committee members ___ the proposed zoning amendments for hours without reaching consensus.", a: ["have discussed", "have been discussing"], h: "Emphasize an extended, uninterrupted deliberation taking place over several hours.", expl: "<b>Grammar & Structure:</b> have discussed for / have been discussing for<br><br><b>Temporal Anchor & Aspect:</b> Uninterrupted deliberations taking place over a continuous time period ('for hours') call for the present perfect continuous aspect.", tag: "tag-verb" },
  { q: "High-speed rail connectivity ___ regional commerce across the province since its launch in 2018.", a: ["has transformed", "has been transforming"], h: "Trace economic transformation back to the exact year of rail line inauguration.", expl: "<b>Grammar & Structure:</b> has transformed since / has been transforming since<br><br><b>Temporal Anchor & Aspect:</b> Pinpointing a specific inauguration milestone ('since its launch in 2018') requires the present perfect aspect to connect that past event to ongoing present impacts.", tag: "tag-verb" },
  { q: "The chief archivist ___ rare historical manuscripts for the national library for over a decade.", a: ["has cataloged", "has been cataloging", "has catalogued", "has been cataloguing"], h: "Quantify a specialized professional task spanning a ten-year duration.", expl: "<b>Grammar & Structure:</b> has cataloged for / has been cataloging for<br><br><b>Temporal Anchor & Aspect:</b> Specialized professional tasks carried out over a decade-long duration ('for over a decade') take the present perfect simple or continuous with <b>for</b>.", tag: "tag-verb" },
  { q: "The urban district ___ rapid gentrification since the university constructed its new campus.", a: ["has experienced", "has undergone"], h: "Link social neighborhood changes to a major construction milestone.", expl: "<b>Grammar & Structure:</b> has experienced since / has undergone since<br><br><b>Temporal Anchor & Aspect:</b> A past construction milestone ('since the university constructed...') serves as the origin point, governing the present perfect in the main clause.", tag: "tag-verb" },
  { q: "Volunteers ___ emergency relief packages for flood victims for forty-eight continuous hours.", a: ["have prepared", "have been preparing", "have assembled", "have been assembling"], h: "Highlight exhaustive physical volunteer effort measured over a two-day timeframe.", expl: "<b>Grammar & Structure:</b> have prepared for / have been preparing for<br><br><b>Temporal Anchor & Aspect:</b> Continuous active effort measured over a defined timeframe ('forty-eight continuous hours') is expressed using the present perfect continuous with <b>for</b>.", tag: "tag-verb" },
  { q: "Strict data privacy standards ___ enforced across all corporate divisions since Q1.", a: ["have been"], h: "Mark the corporate compliance enforcement starting at the first quarter.", expl: "<b>Grammar & Structure:</b> have been enforced since<br><br><b>Temporal Anchor & Aspect:</b> The temporal preposition <b>since</b> introduces the starting quarter ('since Q1'), governing the present perfect passive auxiliary <i>have been</i>.", tag: "tag-verb" },
  { q: "The clinical trial participants ___ daily symptom journals for three full months.", a: ["have maintained", "have been maintaining", "have kept", "have been keeping"], h: "Measure patient record-keeping over a ninety-day clinical trial window.", expl: "<b>Grammar & Structure:</b> have maintained for / have been keeping for<br><br><b>Temporal Anchor & Aspect:</b> Recording or tracking activity measured across a three-month duration requires the present perfect simple or continuous paired with <b>for</b>.", tag: "tag-verb" },
  { q: "Interest rates in the eurozone ___ at historic lows since the central bank intervention.", a: ["have stayed", "have remained"], h: "Show financial rate stability tied to a major central bank policy event.", expl: "<b>Grammar & Structure:</b> have stayed since / have remained since<br><br><b>Temporal Anchor & Aspect:</b> Continuous state stability originating at a central bank intervention is anchored by <b>since</b>, requiring the present perfect.", tag: "tag-verb" },
  { q: "Software engineers ___ to resolve the critical database bug for over twenty-four hours.", a: ["have labored", "have been laboring", "have worked", "have been working", "have tried", "have been trying"], h: "Emphasize intensive technical troubleshooting spanning a full twenty-four hour period.", expl: "<b>Grammar & Structure:</b> have been working for / have been trying for<br><br><b>Temporal Anchor & Aspect:</b> Intensive continuous technical tasks spanning a 24-hour duration require <b>for</b> with the present perfect continuous.", tag: "tag-verb" },
  { q: "The international space station ___ continuous human habitation since November 2000.", a: ["has supported", "has seen", "has hosted"], h: "Trace unbroken human presence in space from a specific historical month.", expl: "<b>Grammar & Structure:</b> has supported since / has hosted since<br><br><b>Temporal Anchor & Aspect:</b> A specific calendar starting month ('November 2000') marked by <b>since</b> dictates the use of the present perfect aspect in the main clause.", tag: "tag-verb" },
  { q: "The marketing department ___ user engagement metrics across social media platforms for weeks.", a: ["has tracked", "has been tracking"], h: "Measure analytical tracking conducted across multiple consecutive weeks.", expl: "<b>Grammar & Structure:</b> has tracked for / has been tracking for<br><br><b>Temporal Anchor & Aspect:</b> Measuring ongoing analytical activity over an extended duration ('for weeks') requires the present perfect aspect.", tag: "tag-verb" },
  { q: "A diplomatic stalemate ___ progress in the peace negotiations since the summit collapsed.", a: ["has hindered", "has blocked", "has stalled"], h: "Link political gridlock directly to the moment the peace summit broke down.", expl: "<b>Grammar & Structure:</b> has hindered since / has stalled since<br><br><b>Temporal Anchor & Aspect:</b> The clause 'since the summit collapsed' marks the point of origin for an ongoing state of gridlock, governing the present perfect.", tag: "tag-verb" },
  { q: "The university language center ___ intensive English immersion courses for over thirty years.", a: ["has offered", "has been offering"], h: "Measure educational course provision spanning a three-decade period.", expl: "<b>Grammar & Structure:</b> has offered for / has been offering for<br><br><b>Temporal Anchor & Aspect:</b> Providing services across a three-decade duration ('for over thirty years') requires <b>for</b> paired with the present perfect simple or continuous.", tag: "tag-verb" }
];

let currentQuizType = 'A';
let currentData = quizA;
let idx = 0;
let streak = 0;
let score = 0;
let solvedThisIdx = false;

function getBritishFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;

  const preferredFemaleVoices = [
    'Victoria', 'Karen', 'Moira', 'Tessa', 'Samantha', 'Zoe', 'Hazel', 'Susan',
    'Google UK English Female',
    'Microsoft Libby Online (Natural) - English (United Kingdom)',
    'Microsoft Sonia Online (Natural) - English (United Kingdom)',
    'Microsoft Zira',
    'Serena', 'Kate', 'Stephanie', 'Fiona', 'Martha'
  ];

  for (const name of preferredFemaleVoices) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return found;
  }

  const maleKeywords = ['male', 'george', 'daniel', 'ryan', 'arthur', 'oliver', 'david', 'mark', 'fred', 'alex', 'bruce', 'tom', 'lee', 'nathan', 'edward', 'aaron', 'albert', 'alfie', 'benjamin', 'brandon', 'callum', 'charles', 'charlie', 'christian', 'connor', 'dylan', 'elliot', 'ethan', 'felix', 'finley', 'fynn', 'harrison', 'harvey', 'henry', 'isaac', 'jack', 'jacob', 'james', 'jason', 'jayden', 'leo', 'leonard', 'liam', 'logan', 'louis', 'lucas', 'luke', 'mason', 'matthew', 'max', 'michael', 'mohammed', 'muhammad', 'nicholas', 'noah', 'oscar', 'owen', 'patrick', 'peter', 'philip', 'richard', 'robert', 'samuel', 'sebastian', 'theo', 'thomas', 'toby', 'tyler', 'william', 'zachary'];

  const enFemale = voices.find(v => {
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    const name = (v.name || '').toLowerCase();
    const isEnglish = lang.startsWith('en') || name.includes('english') || name.includes('united kingdom') || name.includes('british');
    const isMale = maleKeywords.some(m => name.includes(m));
    return isEnglish && !isMale;
  });

  if (enFemale) return enFemale;

  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

function speakCurrentSentence() {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  
  const card = currentData[idx];
  const sentence = card.q.replace(/___+/g, 'blank').replace(/[\(\)\/]/g, ' ');
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'en-GB';
  utterance.rate = 0.98;
  utterance.pitch = 1.05;

  const executeSpeech = () => {
    const voice = getBritishFemaleVoice();
    if (voice) {
      utterance.voice = voice;
    }
    window.speechSynthesis.speak(utterance);
  };

  let voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) {
    window.speechSynthesis.onvoiceschanged = () => {
      executeSpeech();
    };
    window.speechSynthesis.getVoices();
    setTimeout(executeSpeech, 150);
  } else {
    executeSpeech();
  }
}

function openModal() {
  const tag = currentData[idx].tag;
  document.getElementById('modalTitle').innerText = rules[tag].title;
  document.getElementById('modalText').innerHTML = rules[tag].text;
  document.getElementById('ruleModal').classList.remove('hidden');
  document.getElementById('ruleModal').classList.add('flex');
}

function closeModal() {
  document.getElementById('ruleModal').classList.remove('flex');
  document.getElementById('ruleModal').classList.add('hidden');
}

function update() {
  if (idx >= currentData.length) {
    document.getElementById('final-screen').classList.remove('hidden');
    document.getElementById('final-screen').classList.add('flex');
    document.getElementById('final-stats').innerText = `Tasks completed: ${score}/${currentData.length} | Streak: ${streak}`;
    return;
  }
  const card = currentData[idx];
  document.getElementById('q').innerText = card.q;
  document.getElementById('a').innerText = "Accepted forms: " + card.a.join(" / ");
  document.getElementById('expl').innerHTML = "<span class='font-bold text-amber-900 uppercase text-xs tracking-wider block mb-1'>Grammar & Aspect Rules:</span>" + card.expl;
  let tagName = "PRESENT PERFECT";
  document.getElementById('tagDisplay').innerHTML = `<span class="bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-[13px] font-bold px-5 py-2 rounded-full uppercase tracking-wider shadow-sm transition inline-flex items-center gap-1.5 cursor-pointer">${tagName} (Click for Category ℹ️)</span>`;
  document.getElementById('a').classList.remove('block');
  document.getElementById('a').classList.add('hidden');
  document.getElementById('expl').classList.remove('block');
  document.getElementById('expl').classList.add('hidden');
  document.getElementById('hintBox').classList.remove('block');
  document.getElementById('hintBox').classList.add('hidden');
  document.getElementById('feedback').innerText = '';
  document.getElementById('userInput').value = '';
  document.getElementById('pg').innerText = `Task ${idx + 1} of ${currentData.length}`;
  solvedThisIdx = false;
  document.getElementById('pBtn').disabled = idx === 0;
  document.getElementById('pBtn').classList.toggle('opacity-50', idx === 0);
}

function checkAnswer() {
  const u = document.getElementById('userInput').value.toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();
  if(!u) return;
  const card = currentData[idx];
  const isCorrect = card.a.some(ans => {
    const normalizedAns = ans.toLowerCase().replace(/[\/\,]/g, ' ').replace(/\s+/g, ' ').trim();
    return u === normalizedAns;
  });

  if (isCorrect) {
    document.getElementById('feedback').innerText = "CORRECT! ✨";
    document.getElementById('feedback').className = 'h-7 mb-3 font-bold text-base text-emerald-600';
    document.getElementById('a').classList.remove('hidden');
    document.getElementById('a').classList.add('block');
    document.getElementById('expl').classList.remove('hidden');
    document.getElementById('expl').classList.add('block');
    if (!solvedThisIdx) { streak++; score++; solvedThisIdx = true; }
  } else {
    document.getElementById('feedback').innerText = "TRY AGAIN ❌";
    document.getElementById('feedback').className = 'h-7 mb-3 font-bold text-base text-rose-600';
    streak = 0;
  }
  document.getElementById('streak-count').innerText = streak;
  document.getElementById('score-display').innerText = score;
}

function showHint() {
  document.getElementById('hintBox').innerText = "💡 " + currentData[idx].h;
  document.getElementById('hintBox').classList.remove('hidden');
  document.getElementById('hintBox').classList.add('block');
}

function revealAnswer() {
  document.getElementById('a').classList.remove('hidden');
  document.getElementById('a').classList.add('block');
  document.getElementById('expl').classList.remove('hidden');
  document.getElementById('expl').classList.add('block');
  streak = 0;
  document.getElementById('streak-count').innerText = streak;
}

function next() {
  if (idx < currentData.length - 1) {
    idx++;
    update();
  } else {
    idx++;
    update();
  }
}

function prev() {
  if (idx > 0) {
    idx--;
    update();
  }
}

function switchQuiz(type) {
  currentQuizType = type;
  currentData = (type === 'A') ? quizA : quizB;
  idx = 0;
  score = 0;
  streak = 0;
  solvedThisIdx = false;
  document.getElementById("tabA").className = (type === 'A') ? "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer" : "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition cursor-pointer";
  document.getElementById("tabB").className = (type === 'B') ? "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold bg-white text-blue-600 shadow-sm transition cursor-pointer" : "py-3 px-4 rounded-xl flex-1 text-center text-sm sm:text-base font-bold text-slate-600 hover:text-slate-900 transition cursor-pointer";
  document.getElementById("subTitle").innerText = `Present Perfect Master Practice (Quiz ${type})`;
  document.getElementById('final-screen').classList.remove('flex');
  document.getElementById('final-screen').classList.add('hidden');
  update();
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') checkAnswer();
});

document.getElementById('btn-audio').onclick = speakCurrentSentence;
document.getElementById('btn-reset').onclick = () => {
  if (confirm('Reset from task 1 and clear your progress?')) {
    score = 0;
    streak = 0;
    solvedThisIdx = false;
    idx = 0;
    update();
  }
};

update();
</script>
