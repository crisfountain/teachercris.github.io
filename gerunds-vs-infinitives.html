// Deterministic option distribution offsets
const SHUFFLE_OFFSETS = [
  1, 2, 0, 3, 2, 1, 3, 0, 2, 1, 0, 3,
  2, 0, 1, 3, 1, 2, 0, 3, 2, 0, 1, 3,
  0, 2, 1, 3, 2, 0, 1, 3, 1, 2, 0, 3,
  2, 0, 1, 3, 2, 1, 0, 3, 1
];

// Build distributed dataset
const dataset = rawDataset.map((item, idx) => {
  const correctVal = item.options[0];
  const others = item.options.slice(1);
  const targetIdx = SHUFFLE_OFFSETS[idx % SHUFFLE_OFFSETS.length] % 4;
  const newOpts = [];
  let ptr = 0;
  for (let i = 0; i < 4; i++) {
    if (i === targetIdx) newOpts.push(correctVal);
    else newOpts.push(others[ptr++]);
  }
  return {
    ...item,
    options: newOpts,
    correct: targetIdx
  };
});

let currentIndex = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let optionSelected = false;

// Web Audio synthesizer for tactile sound
function playSound(type) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    if (type === 'success') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(190, now + 0.18);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    }
  } catch(e) {}
}

// British English Text-to-Speech
let britishVoice = null;
function findBritishVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const ukVoices = voices.filter(v => 
    v.lang === 'en-GB' || 
    v.lang === 'en_GB' || 
    v.lang.toLowerCase().startsWith('en-gb') ||
    v.name.toLowerCase().includes('united kingdom') ||
    v.name.toLowerCase().includes('uk english') ||
    v.name.toLowerCase().includes('british')
  );
  if (ukVoices.length > 0) {
    britishVoice = ukVoices.find(v => v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Daniel') || v.name.includes('Libby')) || ukVoices[0];
  } else {
    britishVoice = voices.find(v => v.lang.startsWith('en')) || null;
  }
  return britishVoice;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = findBritishVoice;
  findBritishVoice();
}

function speakBritish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-GB';
  utterance.rate = 0.92;
  const voice = britishVoice || findBritishVoice();
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}

function getCompletedSentence() {
  const current = dataset[currentIndex];
  return current.q.replace('___', current.options[current.correct]);
}

function loadChallenge() {
  if (currentIndex >= dataset.length) {
    showFinalSummary();
    return;
  }

  optionSelected = false;
  const current = dataset[currentIndex];

  document.getElementById('progreso-texto').innerText = `Challenge ${currentIndex + 1} of ${dataset.length}`;
  document.getElementById('categoria-badge').innerText = current.category || 'Standard';
  document.getElementById('puntuacion').innerText = `Score: ${score}`;
  document.getElementById('barra-progreso').style.width = `${((currentIndex + 1) / dataset.length) * 100}%`;

  if (streak > 1) {
    document.getElementById('streak-badge').innerText = `🔥 ${streak} Streak`;
    document.getElementById('streak-badge').classList.remove('hidden');
  } else {
    document.getElementById('streak-badge').classList.add('hidden');
  }

  // Render question with prominent blank
  const parts = current.q.split('___');
  const qHtml = parts[0] + '<span id="blank-slot" class="inline-block mx-1.5 px-3 py-0.5 rounded-lg border font-extrabold bg-white text-indigo-600 border-indigo-200/80 shadow-xs">_____</span>' + (parts[1] || '');
  document.getElementById('pregunta-texto').innerHTML = qHtml;

  // Reset hint
  document.getElementById('pista-contenido').innerText = current.h;
  document.getElementById('pista-texto').classList.add('hidden');

  // Reset feedback
  document.getElementById('feedback-box').className = 'hidden p-5 rounded-2xl mb-8 border transition-all duration-300';
  document.getElementById('btn-siguiente').classList.add('hidden');

  // Options
  const container = document.getElementById('opciones-contenedor');
  container.innerHTML = '';

  current.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'w-full text-left p-4 rounded-xl border border-slate-200 font-medium text-slate-700 hover:bg-indigo-50 hover:border-indigo-300 transition flex justify-between items-center shadow-xs cursor-pointer';
    btn.innerHTML = `<div class="flex items-center gap-3"><span class="w-6 h-6 rounded-lg bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center shrink-0">${idx + 1}</span><span class="text-base">${opt}</span></div><i class="far fa-circle text-slate-300 text-lg"></i>`;
    btn.onclick = () => checkAnswer(idx);
    container.appendChild(btn);
  });
}

function checkAnswer(selectedIdx) {
  if (optionSelected) return;
  optionSelected = true;

  const current = dataset[currentIndex];
  const isCorrect = (selectedIdx === current.correct);

  if (isCorrect) {
    score++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    playSound('success');
  } else {
    streak = 0;
    playSound('error');
  }

  // Update blank slot
  const slot = document.getElementById('blank-slot');
  if (slot) {
    slot.innerText = current.options[current.correct];
    slot.className = 'inline-block mx-1.5 px-3 py-0.5 rounded-lg border font-extrabold bg-indigo-100 text-indigo-800 border-indigo-200';
  }

  const buttons = document.getElementById('opciones-contenedor').children;
  Array.from(buttons).forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === current.correct) {
      btn.className = 'w-full text-left p-4 rounded-xl border-2 border-emerald-500 font-bold text-emerald-800 bg-emerald-50 transition flex justify-between items-center shadow-xs';
      btn.querySelector('i').className = 'fas fa-check-circle text-emerald-600 text-lg';
    } else if (idx === selectedIdx && !isCorrect) {
      btn.className = 'w-full text-left p-4 rounded-xl border-2 border-rose-400 font-bold text-rose-800 bg-rose-50 transition flex justify-between items-center shadow-xs';
      btn.querySelector('i').className = 'fas fa-times-circle text-rose-500 text-lg';
    } else {
      btn.className = 'w-full text-left p-4 rounded-xl border border-slate-100 font-normal text-slate-400 bg-slate-50 opacity-60 flex justify-between items-center cursor-not-allowed';
    }
  });

  // Feedback Box
  const feedbackBox = document.getElementById('feedback-box');
  const feedbackTitulo = document.getElementById('feedback-titulo');
  const feedbackExplicacion = document.getElementById('feedback-explicacion');
  const feedbackAlert = document.getElementById('feedback-alert');
  const feedbackChunk = document.getElementById('feedback-chunk');

  if (isCorrect) {
    feedbackBox.classList.add('bg-emerald-50', 'border-emerald-200');
    feedbackTitulo.innerText = 'Excellent / Correct!';
    feedbackTitulo.className = 'font-bold text-lg mb-2 text-emerald-800';
  } else {
    feedbackBox.classList.add('bg-rose-50', 'border-rose-200');
    feedbackTitulo.innerText = 'Take Note / Key Distinction!';
    feedbackTitulo.className = 'font-bold text-lg mb-2 text-rose-800';
  }

  feedbackExplicacion.innerHTML = current.expl;
  feedbackAlert.innerText = current.alert;
  feedbackChunk.innerText = `Chunk: ${current.chunk}`;

  feedbackBox.classList.remove('hidden');
  document.getElementById('btn-siguiente').classList.remove('hidden');
  document.getElementById('puntuacion').innerText = `Score: ${score}`;
}

document.getElementById('btn-pista').onclick = () => {
  document.getElementById('pista-texto').classList.toggle('hidden');
};

document.getElementById('btn-siguiente').onclick = () => {
  currentIndex++;
  loadChallenge();
};

document.getElementById('btn-audio-sentence').onclick = () => {
  speakBritish(getCompletedSentence());
};

document.getElementById('btn-audio-feedback').onclick = () => {
  speakBritish(getCompletedSentence());
};

window.addEventListener('keydown', (e) => {
  if (!optionSelected) {
    if (['1','2','3','4'].includes(e.key)) {
      checkAnswer(parseInt(e.key) - 1);
    } else if (e.key.toLowerCase() === 'h') {
      document.getElementById('pista-texto').classList.toggle('hidden');
    }
  } else {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      document.getElementById('btn-siguiente').click();
    }
  }
});
